    <rect x="60" y="50" width="210" height="40"/>
    <rect x="60" y="113" width="210" height="40"/>
    <rect x="60" y="177" width="210" height="40"/>
    <rect x="60" y="254" width="210" height="39"/>
    <rect x="60" y="317" width="210" height="39"/>
    <rect x="60" y="380" width="210" height="39"/>
    <rect x="60" y="456" width="210" height="39"/>
    <rect x="60" y="519" width="210" height="40"/>
    <rect x="60" y="574" width="210" height="40"/>
  </g>
  <g font-family="Liberation Serif, WenQuanYi Zen Hei, DejaVu Serif, serif" font-size="20" fill="#111" text-anchor="middle">
    <text x="165" y="77">介绍ATAM方法</text>
    <text x="165" y="140">描述商业目标</text>
    <text x="165" y="204">描述体系结构</text>
    <text x="165" y="280">标识体系结构步骤</text>
