<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="710" height="1460" viewBox="0 0 355 730">
  <title>图8-5 ATAM方法的评估实践阶段划分</title>
  <desc>复原自《系统架构设计师教程》(第2版)入库扫描件第298页(印刷页289)右侧图8-5。纵向流程:9个处理框自上而下以单向箭头串联,按4个基本阶段分组;前三个阶段各有点划虚线分组框,右侧竖排阶段名依次为描述和介绍阶段、调查和分析阶段、测试阶段,报告阶段(提交结果框)无分组框。逐节点对照印面转录,渲染核对后交付。</desc>
  <rect x="0" y="0" width="355" height="730" fill="#ffffff"/>
  <!-- 阶段分组虚线框 -->
  <g fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="7 5">
    <rect x="27" y="42" width="291" height="180"/>
    <rect x="27" y="245" width="291" height="181"/>
    <rect x="27" y="448" width="291" height="118"/>
  </g>
  <!-- 连线与箭头 -->
  <g stroke="#555" stroke-width="1.4" fill="none">
    <line x1="165" y1="90" x2="165" y2="104"/>
    <line x1="165" y1="153" x2="165" y2="168"/>
    <line x1="165" y1="217" x2="165" y2="245"/>
    <line x1="165" y1="293" x2="165" y2="308"/>
    <line x1="165" y1="356" x2="165" y2="371"/>
    <line x1="165" y1="419" x2="165" y2="447"/>
    <line x1="165" y1="495" x2="165" y2="510"/>
    <line x1="165" y1="559" x2="165" y2="565"/>
  </g>
  <g fill="#555">
    <polygon points="160.5,104 169.5,104 165,112"/>
    <polygon points="160.5,168 169.5,168 165,176"/>
    <polygon points="160.5,245 169.5,245 165,253"/>
    <polygon points="160.5,308 169.5,308 165,316"/>
    <polygon points="160.5,371 169.5,371 165,379"/>
    <polygon points="160.5,447 169.5,447 165,455"/>
    <polygon points="160.5,510 169.5,510 165,518"/>
    <polygon points="160.5,565 169.5,565 165,573"/>
  </g>
  <!-- 处理框 -->
