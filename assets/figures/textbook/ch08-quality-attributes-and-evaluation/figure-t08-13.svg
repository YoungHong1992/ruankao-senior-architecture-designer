<text x="92" y="134" font-family="serif" font-size="15" fill="#000000" text-anchor="start">Components in framework interact in a coordinated manner</text>
<text x="92" y="156" font-family="serif" font-size="15" fill="#000000" text-anchor="start">框架中的组件通过交互协议交互</text>
<text x="847" y="192" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Functionality</text>
<text x="847" y="214" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">功能性</text>
<text x="47" y="203" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">13</text>
<text x="92" y="192" font-family="serif" font-size="15" fill="#000000" text-anchor="start">Overall consistent behavior expected from the architecture</text>
<text x="92" y="214" font-family="serif" font-size="15" fill="#000000" text-anchor="start">架构预期的整体行为一致</text>
<text x="47" y="261" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">14</text>
<text x="92" y="250" font-family="serif" font-size="15" fill="#000000" text-anchor="start">Framework should be complete clear and perform exactly as required.</text>
<text x="92" y="272" font-family="serif" font-size="15" fill="#000000" text-anchor="start">框架应该是完全清晰的，并且完全按照需求执行</text>
<text x="47" y="319" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">4</text>
<text x="92" y="308" font-family="serif" font-size="15" fill="#000000" text-anchor="start">User errors in using system should be handled</text>
<text x="92" y="330" font-family="serif" font-size="15" fill="#000000" text-anchor="start">处理用户在使用系统时出现的错误</text>
<text x="847" y="308" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Reliability</text>
<text x="847" y="330" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">可靠性</text>
<text x="47" y="377" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">5</text>
<text x="92" y="366" font-family="serif" font-size="15" fill="#000000" text-anchor="start">New demands on system functionality should be accommodated.</text>
<text x="92" y="388" font-family="serif" font-size="15" fill="#000000" text-anchor="start">适应系统新的功能需求</text>
<text x="847" y="366" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Modifiability</text>
<text x="847" y="388" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">可修改性</text>
<text x="47" y="435" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">1</text>
<text x="92" y="424" font-family="serif" font-size="15" fill="#000000" text-anchor="start">No unauthorized access to the system</text>
<text x="92" y="446" font-family="serif" font-size="15" fill="#000000" text-anchor="start">禁止非法访问系统</text>
<text x="847" y="424" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Security</text>
<text x="847" y="446" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">安全性</text>
<text x="47" y="493" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">2</text>
<text x="92" y="482" font-family="serif" font-size="15" fill="#000000" text-anchor="start">All operations are processed in fastest possible speed</text>
<text x="92" y="504" font-family="serif" font-size="15" fill="#000000" text-anchor="start">所有的操作都以最快的速度处理</text>
<text x="847" y="482" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Performance</text>
<text x="847" y="504" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">性能</text>
<text x="47" y="551" font-family="serif" font-size="13" fill="#000000" text-anchor="middle">6</text>
<text x="92" y="540" font-family="serif" font-size="15" fill="#000000" text-anchor="start">Major parts of the framework should be reusable for future architectures</text>
<text x="92" y="562" font-family="serif" font-size="15" fill="#000000" text-anchor="start">未来的体系结构可重用框架的主体部分</text>
<text x="847" y="540" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">Variability</text>
<text x="847" y="562" font-family="serif" font-size="15" fill="#000000" text-anchor="middle">可变性</text>
