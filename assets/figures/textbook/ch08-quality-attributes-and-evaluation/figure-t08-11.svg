<text x="87" y="28" font-family="serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Scenario</text>
<text x="87" y="50" font-family="serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Type</text>
