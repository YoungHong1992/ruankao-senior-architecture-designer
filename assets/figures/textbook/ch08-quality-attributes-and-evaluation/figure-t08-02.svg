<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440">
  <title>表8-2 可修改性质量属性场景描述</title>
  <desc>复原自 sources/01-系统架构设计师教材 入库扫描件物理页 284(印刷页 275),表题:表8-2 可修改性质量属性场景描述。结构:两列(场景要素/可能的情况),表头加粗;响应、响应度量格各2行,分行照印面;印面两字标签「刺 激」「制 品」有字间空隙,照录为全角空格。</desc>
  <rect x="0" y="0" width="1100" height="440" fill="#ffffff"/>
  <rect x="40" y="44" width="1020" height="382" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="210" y1="44" x2="210" y2="426" stroke="#000000" stroke-width="1"/>
  <text x="125" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">场景要素</text>
  <text x="635" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">可能的情况</text>
  <line x1="40" y1="90" x2="1060" y2="90" stroke="#000000" stroke-width="2"/>
  <text x="125" y="119" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺激源</text>
  <text x="224" y="119" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">最终用户、开发人员、系统管理员</text>
  <line x1="40" y1="136" x2="1060" y2="136" stroke="#000000" stroke-width="1"/>
  <text x="125" y="165" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺　激</text>
  <text x="224" y="165" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">希望增加、删除、修改、改变功能、质量属性、容量等</text>
  <line x1="40" y1="182" x2="1060" y2="182" stroke="#000000" stroke-width="1"/>
  <text x="125" y="211" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">环境</text>
  <text x="224" y="211" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统设计时、编译时、构建时、运行时</text>
  <line x1="40" y1="228" x2="1060" y2="228" stroke="#000000" stroke-width="1"/>
  <text x="125" y="257" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">制　品</text>
  <text x="224" y="257" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统用户界面、平台、环境或与目标系统交互的系统</text>
  <line x1="40" y1="274" x2="1060" y2="274" stroke="#000000" stroke-width="1"/>
  <text x="125" y="318" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应</text>
  <text x="224" y="303" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">查找架构中需要修改的位置，进行修改且不会影响其他功能，对所做的修改进行测试，部</text>
  <text x="224" y="333" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">署所做的修改</text>
  <line x1="40" y1="350" x2="1060" y2="350" stroke="#000000" stroke-width="1"/>
  <text x="125" y="394" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应度量</text>
  <text x="224" y="379" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">根据所影响元素的数量度量的成本、努力、资金；该修改对其他功能或质量属性所造成影</text>
  <text x="224" y="409" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响的程度</text>
  <line x1="40" y1="426" x2="1060" y2="426" stroke="#000000" stroke-width="1.5"/>
</svg>
