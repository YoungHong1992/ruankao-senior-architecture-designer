<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380">
  <title>表8-3 性能质量属性场景描述</title>
  <desc>复原自 sources/01-系统架构设计师教材 入库扫描件物理页 284(印刷页 275),表题:表8-3 性能质量属性场景描述。结构:两列(场景要素/可能的情况),表头加粗;每格单行;印面标签「制 品」有字间空隙,照录为全角空格;「超载（Overload）模式」括号为全角,照录。</desc>
  <rect x="0" y="0" width="1100" height="380" fill="#ffffff"/>
  <rect x="40" y="44" width="1020" height="322" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="210" y1="44" x2="210" y2="366" stroke="#000000" stroke-width="1"/>
  <text x="125" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">场景要素</text>
  <text x="635" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">可能的情况</text>
  <line x1="40" y1="90" x2="1060" y2="90" stroke="#000000" stroke-width="2"/>
  <text x="125" y="119" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺激源</text>
  <text x="224" y="119" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">用户请求，其他系统触发等</text>
  <line x1="40" y1="136" x2="1060" y2="136" stroke="#000000" stroke-width="1"/>
  <text x="125" y="165" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺激</text>
  <text x="224" y="165" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">定期事件到达、随机事件到达、偶然事件到达</text>
  <line x1="40" y1="182" x2="1060" y2="182" stroke="#000000" stroke-width="1"/>
  <text x="125" y="211" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">环境</text>
  <text x="224" y="211" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">正常模式、超载（Overload）模式</text>
  <line x1="40" y1="228" x2="1060" y2="228" stroke="#000000" stroke-width="1"/>
  <text x="125" y="257" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">制　品</text>
  <text x="224" y="257" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统</text>
  <line x1="40" y1="274" x2="1060" y2="274" stroke="#000000" stroke-width="1"/>
  <text x="125" y="303" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应</text>
  <text x="224" y="303" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">处理刺激、改变服务级别</text>
  <line x1="40" y1="320" x2="1060" y2="320" stroke="#000000" stroke-width="1"/>
  <text x="125" y="349" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应度量</text>
  <text x="224" y="349" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">等待时间、期限、吞吐量、抖动、缺失率、数据丢失率</text>
  <line x1="40" y1="366" x2="1060" y2="366" stroke="#000000" stroke-width="1.5"/>
</svg>
