<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="676" viewBox="0 0 1100 676">
  <title>表8-1 可用性质量属性场景描述</title>
  <desc>复原自 sources/01-系统架构设计师教材 入库扫描件物理页 283-284(印刷页 274-275),表题:表8-1 可用性质量属性场景描述。结构:两列(场景要素/可能的情况),表头加粗;跨页续表在一幅SVG内连续呈现,印面「(续表)」标记照录于响应行与重复表头之间;响应格5行、响应度量格4行,单元格内分行照印面。</desc>
  <rect x="0" y="0" width="1100" height="676" fill="#ffffff"/>
  <rect x="40" y="44" width="1020" height="618" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="210" y1="44" x2="210" y2="662" stroke="#000000" stroke-width="1"/>
  <text x="125" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">场景要素</text>
  <text x="635" y="73" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">可能的情况</text>
  <line x1="40" y1="90" x2="1060" y2="90" stroke="#000000" stroke-width="2"/>
  <text x="125" y="119" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺激源</text>
  <text x="224" y="119" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统内部、系统外部</text>
  <line x1="40" y1="136" x2="1060" y2="136" stroke="#000000" stroke-width="1"/>
  <text x="125" y="165" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">刺激</text>
  <text x="224" y="165" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">疏忽、错误、崩溃、时间</text>
  <line x1="40" y1="182" x2="1060" y2="182" stroke="#000000" stroke-width="1"/>
  <text x="125" y="211" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">环境</text>
  <text x="224" y="211" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">正常操作、降级模式</text>
  <line x1="40" y1="228" x2="1060" y2="228" stroke="#000000" stroke-width="1"/>
  <text x="125" y="257" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">制品</text>
  <text x="224" y="257" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统处理器、通信信道、持久存储器、进程</text>
  <line x1="40" y1="274" x2="1060" y2="274" stroke="#000000" stroke-width="1"/>
  <text x="125" y="363" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应</text>
  <text x="224" y="303" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统应该检测事件、并进行如下一个或多个活动：</text>
  <text x="224" y="333" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">将其记录下来通知适当的各方，包括用户和其他系统；根据已定义的规则禁止导致错误或</text>
  <text x="224" y="363" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">故障的事件源</text>
  <text x="224" y="393" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">在一段预先指定的时间间隔内不可用，其中，时间间隔取决于系统的关键程度在正常或降</text>
  <text x="224" y="423" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">级模式下运行</text>
  <line x1="40" y1="440" x2="1060" y2="440" stroke="#000000" stroke-width="1"/>
  <text x="1048" y="468" text-anchor="end" font-family="WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="bold" fill="#000000">（续表）</text>
  <line x1="40" y1="480" x2="1060" y2="480" stroke="#000000" stroke-width="1"/>
  <text x="125" y="509" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">场景要素</text>
  <text x="635" y="509" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="bold" fill="#000000">可能的情况</text>
  <line x1="40" y1="526" x2="1060" y2="526" stroke="#000000" stroke-width="2"/>
  <text x="125" y="600" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">响应度量</text>
  <text x="224" y="555" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统必须可用的时间间隔</text>
  <text x="224" y="585" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">可用时间</text>
  <text x="224" y="615" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">系统可以在降级模式下运行的时间间隔</text>
  <text x="224" y="645" font-family="WenQuanYi Zen Hei, sans-serif" font-size="15" fill="#000000">故障修复时间</text>
  <line x1="40" y1="662" x2="1060" y2="662" stroke="#000000" stroke-width="1.5"/>
</svg>
