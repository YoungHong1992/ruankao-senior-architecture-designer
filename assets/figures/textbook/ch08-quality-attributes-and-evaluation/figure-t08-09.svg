<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1320" viewBox="0 0 1020 660">
  <title>表8-9与利益相关者有关的情景和其代表的质量属性</title>
  <desc>复原自《系统架构设计师教程》(第2版)入库扫描件第302页(印刷页293)表8-9。三列(利益相关者/场景/质量属性)14行;利益相关者列按印面跨行合并:用户(第1-5行)、架构师(第6-13行)、应用开发人员(第14行),组内行分隔线仅贯穿场景与质量属性两列,组边界与表顶线、表底线、栏目线为全宽;表左右两侧无外框竖线,照印面呈现。逐格对照印面转录(第3行印面作"失效发生后应该立即回复"、第10与第12行质量属性均印作"可移植性",照录),渲染核对后交付。</desc>
  <rect x="0" y="0" width="1020" height="660" fill="#ffffff"/>
  <!-- 表题 -->
  <!-- 表线:全宽横线(顶线/栏目线/组边界/底线) -->
  <g stroke="#333" stroke-width="1.8">
    <line x1="16" y1="43" x2="997" y2="43"/>
    <line x1="16" y1="84" x2="997" y2="84"/>
    <line x1="16" y1="285" x2="997" y2="285"/>
    <line x1="16" y1="606" x2="997" y2="606"/>
    <line x1="16" y1="646" x2="997" y2="646"/>
  </g>
  <!-- 组内行分隔线(仅贯穿后两列) -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="172" y1="123" x2="997" y2="123"/>
    <line x1="172" y1="165" x2="997" y2="165"/>
    <line x1="172" y1="203" x2="997" y2="203"/>
    <line x1="172" y1="245" x2="997" y2="245"/>
    <line x1="172" y1="325" x2="997" y2="325"/>
    <line x1="172" y1="365" x2="997" y2="365"/>
    <line x1="172" y1="405" x2="997" y2="405"/>
    <line x1="172" y1="445" x2="997" y2="445"/>
    <line x1="172" y1="485" x2="997" y2="485"/>
    <line x1="172" y1="525" x2="997" y2="525"/>
    <line x1="172" y1="565" x2="997" y2="565"/>
  </g>
  <!-- 列分隔竖线(全高;表左右两侧无外框竖线,照印面) -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="172" y1="43" x2="172" y2="646"/>
    <line x1="876" y1="43" x2="876" y2="646"/>
  </g>
  <!-- 栏目头 -->
  <g font-family="Liberation Serif, WenQuanYi Zen Hei, DejaVu Serif, serif" font-size="21" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="94" y="71">利益相关者</text>
    <text x="524" y="71">场景</text>
    <text x="936" y="71">质量属性</text>
  </g>
  <!-- 利益相关者(跨行合并) -->
  <g font-family="Liberation Serif, WenQuanYi Zen Hei, DejaVu Serif, serif" font-size="20" fill="#111" text-anchor="middle">
    <text x="94" y="192">用户</text>
    <text x="94" y="452">架构师</text>
    <text x="94" y="633">应用开发人员</text>
  </g>
  <!-- 场景 -->
  <g font-family="Liberation Serif, WenQuanYi Zen Hei, DejaVu Serif, serif" font-size="20" fill="#111">
    <text x="179" y="111">针对系统的未授权访问</text>
    <text x="179" y="151">所有操作以尽可能快的速度处理</text>
    <text x="179" y="191">失效发生后应该立即回复</text>
    <text x="179" y="231">处理使用系统过程中的用户错误</text>
    <text x="179" y="272">处理针对系统功能的新需求</text>
    <text x="179" y="312">框架的主要部分应该支持重用</text>
    <text x="179" y="352">框架的修改开销小、速度快、时间短</text>
    <text x="179" y="392">框架中的组件能够协同交互</text>
    <text x="179" y="432">框架能够扩展以支持更复杂的选项</text>
    <text x="179" y="472">可以在不同环境中执行</text>
    <text x="179" y="512">合适的数据封装和安全的数据结构</text>
    <text x="179" y="552">可以用其他编程语言灵活实现</text>
    <text x="179" y="592">架构层面上期望有着全局一致的行为</text>
    <text x="179" y="633">框架应该完整、清晰并与需求一致</text>
  </g>
  <!-- 质量属性 -->
  <g font-family="Liberation Serif, WenQuanYi Zen Hei, DejaVu Serif, serif" font-size="20" fill="#111" text-anchor="middle">
    <text x="934" y="111">安全性</text>
    <text x="934" y="151">性能</text>
    <text x="934" y="191">可用性</text>
    <text x="934" y="231">可靠性</text>
    <text x="934" y="272">可修改性</text>
    <text x="934" y="312">可变性</text>
    <text x="934" y="352">可修改性</text>
    <text x="934" y="392">功能性</text>
    <text x="934" y="432">可变性</text>
    <text x="934" y="472">可移植性</text>
    <text x="934" y="512">安全性</text>
    <text x="934" y="552">可移植性</text>
    <text x="934" y="592">概念一致性</text>
    <text x="934" y="633">功能性</text>
  </g>
</svg>
