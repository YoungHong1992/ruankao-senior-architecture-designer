<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="530" viewBox="0 0 1300 530">
  <title>可靠性测试用例设计时重点考虑的特殊情况（表9-4表格复原）</title>
  <desc>复原自《系统架构设计师教程（第2版）》第9章物理页333（印刷页324）的表9-4正文表格。三列：序号、测试目的、描述；表头加5行数据，全网格线。第4行描述为两行文字；第5行描述先两行文字（“异常情况包括：”后带冒号），续接三个圆点分行列表：硬件故障、网络故障、部分软件模块失效，末尾无“等”字。表题文字行按仓库惯例不入图。</desc>
  <rect x="0" y="0" width="1300" height="530" fill="#ffffff"/>
  <!-- 网格线 -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <line x1="10" y1="58" x2="1290" y2="58"/>
    <line x1="10" y1="112" x2="1290" y2="112"/>
    <line x1="10" y1="166" x2="1290" y2="166"/>
    <line x1="10" y1="220" x2="1290" y2="220"/>
    <line x1="10" y1="312" x2="1290" y2="312"/>
    <line x1="105" y1="10" x2="105" y2="512"/>
    <line x1="480" y1="10" x2="480" y2="512"/>
  </g>
  <rect x="10" y="10" width="1280" height="502" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- 表头 -->
  <g font-family="sans-serif" font-size="26" fill="#000000" text-anchor="middle">
    <text x="57" y="43">序号</text>
    <text x="292" y="43">测试目的</text>
    <text x="885" y="43">描述</text>
    <!-- 行1 -->
    <text x="57" y="94">1</text>
    <text x="292" y="94">屏蔽用户操作错误</text>
    <!-- 行2 -->
    <text x="57" y="148">2</text>
    <text x="292" y="148">错误提示的准确性</text>
    <!-- 行3 -->
    <text x="57" y="202">3</text>
    <text x="292" y="202">错误是否导致系统异常退出</text>
    <!-- 行4 -->
    <text x="57" y="275">4</text>
    <text x="292" y="275">数据可靠性</text>
    <!-- 行5 -->
    <text x="57" y="421">5</text>
    <text x="292" y="421">异常情况的影响</text>
  </g>
  <!-- 描述列（左对齐） -->
  <g font-family="sans-serif" font-size="26" fill="#000000">
    <text x="494" y="94">考虑对用户常见的误操作的提示和屏蔽情况</text>
    <text x="494" y="148">对用户的错误提示准确描述</text>
    <text x="494" y="202">有无操作错误引起系统异常退出的情况</text>
    <text x="494" y="256">系统应对输入的数据进行有效性检查，对冗余的数据进行过滤、</text>
    <text x="494" y="292">校验和清洗，保证数据的正确性和可靠性</text>
    <text x="494" y="348">考察数据和系统的受影响程度，若受损，是否提供补救工具，补</text>
    <text x="494" y="384">救的情况如何。异常情况包括：</text>
    <text x="494" y="420">● 硬件故障</text>
    <text x="494" y="456">● 网络故障</text>
    <text x="494" y="492">● 部分软件模块失效</text>
  </g>
</svg>
