<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <title>图9-1 广义的软件可靠性测试</title>
  <desc>复原自入库教材扫描件物理页320（原书印刷页311）。黑白线稿流程图，无底纹无配色。矩形节点：软件配置、测试配置（顶部一排）；确定可靠性目标、定义运行剖面、设计测试案例（左侧一列）；测试问题集、排错（右侧一排）；测试数据、可靠性数据（中部竖列）；分析影响可靠性的因素、建模或选取模型（左下，前者的文字原书分两行「分析影响／可靠性的因素」）；其他可靠性数据收集（右下，文字分两行「其他可靠性／数据收集」）；可靠性评价（底部中央）。椭圆：实施测试（中部）、可靠性模型（中下）。连线均为细线加实心小箭头：软件配置、测试配置、确定可靠性目标、定义运行剖面、设计测试案例五条输入汇入实施测试；实施测试经测试问题集至排错，排错右侧引出回流线（右、上、左）指回实施测试；实施测试向下经测试数据至可靠性数据汇入可靠性模型，测试数据与可靠性数据之间的箭头旁有文字标注「分析」；分析影响可靠性的因素至建模或选取模型汇入可靠性模型；其他可靠性数据收集指向可靠性模型；可靠性模型向下至可靠性评价。区域标注（纯文字、无框）：狭义的软件可靠性测试（测试问题集、排错一排下方）、广义的软件可靠性测试（右下区域）。版式按原图相对方位复原，列宽与绝对坐标未逐像素复刻。</desc>
