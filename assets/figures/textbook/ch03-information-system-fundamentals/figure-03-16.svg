    <text x="335" y="74">财务管理</text>
    <text x="525" y="74">成本管理</text>
    <text x="705" y="74">基本数据</text>
    <text x="970" y="74">分销资源管理</text>
  </g>

  <rect x="60" y="150" width="1000" height="510" fill="#f8fafd" stroke="#7d8da5" stroke-width="1.6"/>

