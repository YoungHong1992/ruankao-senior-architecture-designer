    <rect x="580" y="470" width="120" height="56"/>
    <rect x="720" y="470" width="120" height="56"/>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="160" y="216">经营管理</text>
    <text x="160" y="296">生产预测</text>
    <text x="160" y="376">销售管理</text>
    <text x="370" y="296">主生产计划</text>
    <text x="555" y="296">□□级生产计划</text>
    <text x="750" y="296">车间作业计划</text>
    <text x="360" y="504">采购管理</text>
    <text x="500" y="504">设备管理</text>
    <text x="640" y="504">工具管理</text>
    <text x="780" y="504">人事管理</text>
  </g>

