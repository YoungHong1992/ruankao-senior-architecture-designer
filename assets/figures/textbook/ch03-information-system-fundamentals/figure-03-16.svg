<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="800" viewBox="0 0 1150 800" font-family="sans-serif">
  <title>图 3-16 ERP结构原理图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 137（物理页 146）插图。共 20 框：顶行 5（综合信息、财务管理、成本管理、基本数据、分销资源管理）与底行 5（客户关系管理、供应链管理、生产管理、质量管理、库存管理）在闭合大实线矩形之外，各自以竖向双箭头接大矩形顶边/底边；大矩形围住左列 3（经营管理、生产预测、销售管理）、中行 3（主生产计划、□□级生产计划、车间作业计划）、中下层 4（采购管理、设备管理、工具管理、人事管理）共 10 框。中行第二框左端两字残缺（第一字仅余斜竖、第二字仅余两短撇，8 倍放大仍无法判定），以 □□ 占位。连线全实线：经营管理、销售管理各引短横线入竖向汇流线，与生产预测的水平线汇合共用一个右向箭头入主生产计划；主生产计划→□□级生产计划→车间作业计划两段右向箭头；中行三框各以竖向双箭头接大矩形顶边；□□级生产计划底边竖线接水平分配线，引 4 条向下单箭头入中下层 4 框顶部。</desc>
  <rect width="1150" height="800" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4">
