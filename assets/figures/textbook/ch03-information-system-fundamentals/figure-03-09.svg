<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="420" viewBox="0 0 1150 420" font-family="sans-serif">
  <title>图 3-9 功能/层次矩阵</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 121（物理页 130）插图。编织式矩阵：7 根细长竖条（上下端伸出最上/最下横带之外）与 4 条横长条带（左右两端伸出最左/最右竖条之外）交叠出 28 个交叉格，格内无文字；格线全部互相贯穿（横带边线连续穿过竖条内部、竖条边线连续穿过横带内部，交点处无遮挡）。列名（竖条顶端上方，两行）：销售/市场、生/产、后勤、人事、财务/会计、信息/处理、高层/管理；行名（横带左端外侧）：战略计划、管理控制、运行控制、业务处理。全部细实线，无合并格。</desc>
  <rect width="1150" height="420" fill="#ffffff"/>

  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="1.3">
    <rect x="150" y="90" width="910" height="55"/>
    <rect x="150" y="155" width="910" height="55"/>
    <rect x="150" y="220" width="910" height="55"/>
    <rect x="150" y="285" width="910" height="55"/>
  </g>
  <g fill="none" stroke="#7d8da5" stroke-width="1.3">
    <rect x="200" y="60" width="110" height="310"/>
    <rect x="320" y="60" width="110" height="310"/>
    <rect x="440" y="60" width="110" height="310"/>
    <rect x="560" y="60" width="110" height="310"/>
    <rect x="680" y="60" width="110" height="310"/>
    <rect x="800" y="60" width="110" height="310"/>
    <rect x="920" y="60" width="110" height="310"/>
  </g>

  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="255" y="36">销售</text><text x="255" y="54">市场</text>
    <text x="375" y="36">生</text><text x="375" y="54">产</text>
    <text x="495" y="36">后</text><text x="495" y="54">勤</text>
    <text x="615" y="36">人</text><text x="615" y="54">事</text>
    <text x="735" y="36">财务</text><text x="735" y="54">会计</text>
    <text x="855" y="36">信息</text><text x="855" y="54">处理</text>
    <text x="975" y="36">高层</text><text x="975" y="54">管理</text>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="end">
    <text x="142" y="123">战略计划</text>
    <text x="142" y="188">管理控制</text>
    <text x="142" y="253">运行控制</text>
    <text x="142" y="318">业务处理</text>
  </g>
</svg>
