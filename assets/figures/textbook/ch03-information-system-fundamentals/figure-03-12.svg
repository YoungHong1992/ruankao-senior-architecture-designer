<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="sans-serif">
  <title>图 3-12 DSS的两库结构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 125（物理页 134）插图。用户（椭圆，左上）、对话子系统（矩形，右上）、数据库子系统（矩形，左下）、模型库子系统（矩形，右下），四条连线均为实线双箭头：用户↔对话子系统（水平）、对话子系统↔数据库子系统（斜线）、对话子系统↔模型库子系统（斜线）、数据库子系统↔模型库子系统（水平）。</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <ellipse cx="180" cy="112" rx="76" ry="34" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.5"/>
  <text x="180" y="118" text-anchor="middle" font-size="15" fill="#1f2937">用户</text>
  <rect x="470" y="88" width="210" height="48" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.5"/>
  <text x="575" y="118" text-anchor="middle" font-size="14" fill="#1f2937">对话子系统</text>
  <rect x="90" y="300" width="210" height="48" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.5"/>
  <text x="195" y="330" text-anchor="middle" font-size="14" fill="#1f2937">数据库子系统</text>
  <rect x="470" y="300" width="210" height="48" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.5"/>
  <text x="575" y="330" text-anchor="middle" font-size="14" fill="#1f2937">模型库子系统</text>

  <g stroke="#4a5568" stroke-width="1.4">
    <line x1="258" y1="112" x2="448" y2="112" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="480" y1="138" x2="288" y2="296" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="575" y1="138" x2="575" y2="296" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="302" y1="324" x2="466" y2="324" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
</svg>
