<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <title>图 3-1 企业中的事务处理</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 114（物理页 123）插图。上下两个大矩形。上框内两行三列六个小框：采购、会计、销售／物料规划、生产、库存控制；行内采购→会计→销售为实线单向箭头；每列上下两框间为实线双箭头。下框（宽于上框）内三列条目各五条：左列 采购合同、收货通知书、供应商发票、给供应商的付款凭证、其他；中列 工艺单、库存记录、员工工时卡、员工工资卡、其他；右列 销售合同、发货通知、顾客发票、顾客的付款凭证、其他。两条虚线自下框顶边上行折入上框：左侧一条箭头指入采购框左边，右侧一条箭头指入销售框右边；另有一条实线自下框顶边（生产下方略偏左）向上单箭头指入上框底边。原书条目为两种字模混排、项目符方点圆点混用（示意性细节，未复刻）。全部条目逐字经扫描件核对。</desc>
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="150" y="40" width="700" height="200" fill="#f8fafd" stroke="#7d8da5" stroke-width="1.5"/>
  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4">
    <rect x="225" y="60" width="110" height="44"/>
    <rect x="445" y="60" width="110" height="44"/>
    <rect x="665" y="60" width="110" height="44"/>
    <rect x="225" y="170" width="110" height="44"/>
    <rect x="445" y="170" width="110" height="44"/>
    <rect x="665" y="170" width="110" height="44"/>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="280" y="88">采购</text>
    <text x="500" y="88">会计</text>
    <text x="720" y="88">销售</text>
    <text x="280" y="198">物料规划</text>
    <text x="500" y="198">生产</text>
    <text x="720" y="198">库存控制</text>
  </g>

  <g stroke="#4a5568" stroke-width="1.4" fill="none">
    <line x1="335" y1="82" x2="443" y2="82" marker-end="url(#arr)"/>
    <line x1="555" y1="82" x2="663" y2="82" marker-end="url(#arr)"/>
    <line x1="280" y1="168" x2="280" y2="107" marker-end="url(#arr)"/>
    <line x1="280" y1="104" x2="280" y2="165" marker-end="url(#arr)"/>
    <line x1="500" y1="168" x2="500" y2="107" marker-end="url(#arr)"/>
    <line x1="500" y1="104" x2="500" y2="165" marker-end="url(#arr)"/>
    <line x1="720" y1="168" x2="720" y2="107" marker-end="url(#arr)"/>
    <line x1="720" y1="104" x2="720" y2="165" marker-end="url(#arr)"/>
    <line x1="470" y1="330" x2="470" y2="242" marker-end="url(#arr)"/>
    <path d="M200 330 V82 H222" stroke-dasharray="7 5" marker-end="url(#arr)"/>
    <path d="M800 330 V82 H778" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  </g>

  <rect x="80" y="330" width="840" height="250" fill="#f8fafd" stroke="#7d8da5" stroke-width="1.5"/>
  <g font-size="14" fill="#1f2937">
    <text x="140" y="375">·采购合同</text>
    <text x="140" y="415">·收货通知书</text>
    <text x="140" y="455">·供应商发票</text>
    <text x="140" y="495">·给供应商的付款凭证</text>
    <text x="140" y="535">·其他</text>
    <text x="420" y="375">·工艺单</text>
    <text x="420" y="415">·库存记录</text>
    <text x="420" y="455">·员工工时卡</text>
    <text x="420" y="495">·员工工资卡</text>
    <text x="420" y="535">·其他</text>
    <text x="700" y="375">·销售合同</text>
    <text x="700" y="415">·发货通知</text>
    <text x="700" y="455">·顾客发票</text>
    <text x="700" y="495">·顾客的付款凭证</text>
    <text x="700" y="535">·其他</text>
  </g>
</svg>
