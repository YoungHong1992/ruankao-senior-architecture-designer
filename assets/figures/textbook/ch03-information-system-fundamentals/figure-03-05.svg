    <path d="M356 162 V205 H334" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M366 162 V217 H334" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="400" y="316" text-anchor="middle" font-size="15" fill="#1f2937">(a)开环系统</text>

