<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" font-family="sans-serif">
  <title>图 3-5 开环与闭环结构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 119（物理页 128）插图，分 (a) 开环系统与 (b) 闭环系统，经三轮盲比与像素级测量修订。六个高框（识别、记录、变换、行动、结果、评价）文字竖排；决策为大号四折角外向开口框，「决」「策」竖排居内；存储框相对记录框右移，记录→存储两条线自记录底边竖直下行后折右、以右向箭头进入存储左缘（右出线入上 1/3、左出线入下 2/3），变换→存储两条两端箭头折线自变换底边折左、以左向箭头进入存储右缘。(a)：虚线框只框记录与变换，存储在框外下方；虚线框上方水平反馈线右端落于决策上方折角顶点、左端向下箭头入识别框顶；评价右缘向右自由端箭头，底边横线自该线 T 形分叉下行（行于存储框下方），向下箭头入事件2框顶；分图题居图下方。(b)：左侧括号为两个顶边短钩加两条短竖线（止于外部行下端）、数据源下方一条悬空底横线（与竖线不相连）；企业下另有短横线；虚线框框住记录、变换与存储；评价右缘向右自由端箭头，底边总线自该线 T 形分叉下行，决策、行动、结果、评价四条向下箭头落到总线，总线沿左侧上行、右向箭头在内部/外部行之间进入括号左竖线；无 (a) 式上方反馈线。</desc>
  <rect width="1080" height="800" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

