<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="sans-serif">
  <title>图 3-13 人工智能主要分支</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 129（物理页 138）插图。顶部矩形「人工智能」；其底中点竖线接一条横贯水平母线，母线引出 6 条竖直落线分别进入 6 个瘦高竖排矩形（一字一行），自左至右：机器人技术、视觉系统、自然语言处理、学习系统、神经网络、专家系统。全部实线，无箭头。</desc>
  <rect width="1000" height="360" fill="#ffffff"/>

  <rect x="400" y="40" width="200" height="50" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.5"/>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#1f2937">人工智能</text>

  <g stroke="#4a5568" stroke-width="1.4">
    <line x1="500" y1="90" x2="500" y2="130"/>
    <line x1="120" y1="130" x2="880" y2="130"/>
    <line x1="180" y1="130" x2="180" y2="160"/>
    <line x1="310" y1="130" x2="310" y2="160"/>
    <line x1="440" y1="130" x2="440" y2="160"/>
    <line x1="570" y1="130" x2="570" y2="160"/>
    <line x1="700" y1="130" x2="700" y2="160"/>
    <line x1="830" y1="130" x2="830" y2="160"/>
  </g>

  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4">
    <rect x="150" y="160" width="60" height="160"/>
    <rect x="280" y="160" width="60" height="160"/>
    <rect x="410" y="160" width="60" height="160"/>
    <rect x="540" y="160" width="60" height="160"/>
    <rect x="670" y="160" width="60" height="160"/>
    <rect x="800" y="160" width="60" height="160"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="180" y="196">机</text><text x="180" y="220">器</text><text x="180" y="244">人</text><text x="180" y="268">技</text><text x="180" y="292">术</text>
    <text x="310" y="208">视</text><text x="310" y="232">觉</text><text x="310" y="256">系</text><text x="310" y="280">统</text>
    <text x="440" y="184">自</text><text x="440" y="208">然</text><text x="440" y="232">语</text><text x="440" y="256">言</text><text x="440" y="280">处</text><text x="440" y="304">理</text>
    <text x="570" y="208">学</text><text x="570" y="232">习</text><text x="570" y="256">系</text><text x="570" y="280">统</text>
    <text x="700" y="208">神</text><text x="700" y="232">经</text><text x="700" y="256">网</text><text x="700" y="280">络</text>
    <text x="830" y="208">专</text><text x="830" y="232">家</text><text x="830" y="256">系</text><text x="830" y="280">统</text>
  </g>
</svg>
