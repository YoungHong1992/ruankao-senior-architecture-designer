<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" font-family="sans-serif">
  <title>图 2-2 两种计算机系统的分类示意</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 25（物理页 34）插图。计算机系统分为嵌入式计算机（电信设备：基站、网络交换、移动终端；家用电子设备：视听设备、厨卫电器；可穿戴电子设备；医疗设备；交通设备；国防设备；金融设备）与通用计算机（个人计算机：台式电脑、平板电脑；网络服务器：云存储、云计算；超级计算机）。原书首分支印作「族嵌入式计算机」，「族」为衍字，据分支内容勘正；图题原书「•种」按 tb-0014 勘正为「两种」。原图节点旁的装饰性底纹未转录。</desc>
  <rect width="760" height="680" fill="#ffffff"/>
  <g stroke="#7d8da5" stroke-width="1.8" fill="none">
    <!-- 根到两大分支 -->
    <path d="M150 326 H185 V246 H218"/>
    <path d="M185 326 V500 H218"/>
    <!-- 嵌入式分支脊线（x=372）与七个叶 -->
    <path d="M335 246 H372"/>
    <path d="M372 72 V313"/>
    <line x1="372" y1="72" x2="386" y2="72"/>
    <line x1="372" y1="127" x2="386" y2="127"/>
    <line x1="372" y1="173" x2="386" y2="173"/>
    <line x1="372" y1="208" x2="386" y2="208"/>
    <line x1="372" y1="243" x2="386" y2="243"/>
    <line x1="372" y1="278" x2="386" y2="278"/>
    <line x1="372" y1="313" x2="386" y2="313"/>
    <!-- 电信设备子叶括线（x=545） -->
    <path d="M480 72 H545"/>
    <path d="M545 50 V94"/>
    <line x1="545" y1="50" x2="560" y2="50"/>
    <line x1="545" y1="72" x2="560" y2="72"/>
    <line x1="545" y1="94" x2="560" y2="94"/>
    <!-- 家用电子设备子叶括线 -->
    <path d="M495 127 H545"/>
    <path d="M545 116 V146"/>
    <line x1="545" y1="116" x2="560" y2="116"/>
    <line x1="545" y1="146" x2="560" y2="146"/>
    <!-- 通用分支脊线（x=372）与三个叶 -->
    <path d="M335 500 H372"/>
    <path d="M372 458 V614"/>
    <line x1="372" y1="458" x2="386" y2="458"/>
    <line x1="372" y1="524" x2="386" y2="524"/>
    <line x1="372" y1="614" x2="386" y2="614"/>
    <!-- 个人计算机子叶括线 -->
    <path d="M478 458 H545"/>
    <path d="M545 436 V480"/>
    <line x1="545" y1="436" x2="560" y2="436"/>
    <line x1="545" y1="480" x2="560" y2="480"/>
    <!-- 网络服务器子叶括线 -->
    <path d="M478 524 H545"/>
    <path d="M545 524 V568"/>
    <line x1="545" y1="524" x2="560" y2="524"/>
    <line x1="545" y1="568" x2="560" y2="568"/>
  </g>
  <g font-size="16" fill="#1f2937">
    <text x="30" y="332">计算机系统</text>
    <text x="196" y="252">嵌入式计算机</text>
    <text x="196" y="506">通用计算机</text>
    <text x="390" y="78">电信设备</text>
    <text x="390" y="133">家用电子设备</text>
    <text x="390" y="179">可穿戴电子设备</text>
    <text x="390" y="214">医疗设备</text>
    <text x="390" y="249">交通设备</text>
    <text x="390" y="284">国防设备</text>
    <text x="390" y="319">金融设备</text>
    <text x="390" y="464">个人计算机</text>
    <text x="390" y="530">网络服务器</text>
    <text x="390" y="620">超级计算机</text>
    <text x="565" y="56">基站</text>
    <text x="565" y="78">网络交换</text>
    <text x="565" y="100">移动终端</text>
    <text x="565" y="122">视听设备</text>
    <text x="565" y="152">厨卫电器</text>
    <text x="565" y="442">台式电脑</text>
    <text x="565" y="486">平板电脑</text>
    <text x="565" y="530">云存储</text>
    <text x="565" y="574">云计算</text>
  </g>
</svg>
