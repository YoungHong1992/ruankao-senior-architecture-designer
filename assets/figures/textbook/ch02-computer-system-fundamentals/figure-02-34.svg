<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="sans-serif">
  <title>图 2-34 UML用例图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 83（物理页 92）插图。系统边界框（登记系统）内四个用例椭圆：入学登记、研讨会登记、执行安全检查、登记家庭成员。关系：入学登记到研讨会登记的 include 虚线箭头（旁注包含关系）；执行安全检查到入学登记的 extend 虚线箭头竖直向上（旁注扩展关系）；登记家庭成员到入学登记的实线泛化、空心三角指向入学登记（旁注泛化关系）。参与者学生以实线关联入学登记；国际留学生以实线关联执行安全检查，另有斜实线关联入学登记；国际留学生到学生为泛化（空心三角朝向学生）。旁注参与者以两条引线分别指向两个参与者，另有用例、系统边界旁注。</desc>
  <rect width="1000" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#556070"/>
    </marker>
    <marker id="g34" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto">
      <path d="M 0.5 0.5 L 9 5 L 0.5 9.5 Z" fill="#ffffff" stroke="#556070" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- 系统边界框 -->
  <rect x="330" y="12" width="600" height="368" fill="none" stroke="#556070" stroke-width="2"/>
  <text x="630" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">登记系统</text>

  <!-- 用例椭圆 -->
  <g fill="#ffffff" stroke="#556070" stroke-width="2">
    <ellipse cx="515" cy="95" rx="124" ry="59"/>
    <ellipse cx="835" cy="103" rx="81" ry="36"/>
    <ellipse cx="521" cy="291" rx="111" ry="47"/>
    <ellipse cx="807" cy="275" rx="92" ry="37"/>
  </g>
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="515" y="101">入学登记</text>
    <text x="835" y="109" font-size="16">研讨会登记</text>
    <text x="521" y="297">执行安全检查</text>
    <text x="807" y="281" font-size="16">登记家庭成员</text>
  </g>

  <!-- include：入学登记 → 研讨会登记 -->
  <line x1="637" y1="93" x2="748" y2="100" stroke="#556070" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a34)"/>
  <circle cx="703" cy="96" r="3.5" fill="#556070"/>
  <text x="695" y="138" text-anchor="middle" font-size="15" fill="#1f2937">&lt;&lt;include&gt;&gt;</text>
  <text x="743" y="48" text-anchor="middle" font-size="15" fill="#1f2937">包含关系</text>
  <path d="M738 54 Q718 74 706 90" fill="none" stroke="#556070" stroke-width="1.3"/>

  <!-- extend：执行安全检查 → 入学登记（竖直向上） -->
  <line x1="521" y1="242" x2="521" y2="162" stroke="#556070" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a34)"/>
  <circle cx="521" cy="207" r="3.5" fill="#556070"/>
  <text x="508" y="201" text-anchor="end" font-size="15" fill="#1f2937">&lt;&lt;extend&gt;&gt;</text>
  <text x="618" y="219" text-anchor="middle" font-size="15" fill="#1f2937">扩展关系</text>
  <path d="M612 213 Q566 208 530 207" fill="none" stroke="#556070" stroke-width="1.3"/>

  <!-- 用例间泛化：登记家庭成员 → 入学登记 -->
  <line x1="760" y1="247" x2="622" y2="142" stroke="#556070" stroke-width="2" marker-end="url(#g34)"/>
  <circle cx="675" cy="190" r="3.5" fill="#556070"/>
  <text x="830" y="203" text-anchor="middle" font-size="15" fill="#1f2937">泛化关系</text>
  <path d="M822 199 Q748 193 684 190" fill="none" stroke="#556070" stroke-width="1.3"/>

  <!-- 参与者：学生 -->
  <g stroke="#556070" stroke-width="2" fill="none">
    <circle cx="241" cy="75" r="11"/>
    <line x1="241" y1="86" x2="241" y2="118"/>
    <line x1="219" y1="95" x2="263" y2="95"/>
    <line x1="241" y1="118" x2="225" y2="140"/>
    <line x1="241" y1="118" x2="257" y2="140"/>
  </g>
  <text x="241" y="192" text-anchor="middle" font-size="16" fill="#1f2937">学生</text>

  <!-- 参与者：国际留学生 -->
  <g stroke="#556070" stroke-width="2" fill="none">
    <circle cx="241" cy="284" r="11"/>
    <line x1="241" y1="295" x2="241" y2="327"/>
    <line x1="219" y1="304" x2="263" y2="304"/>
    <line x1="241" y1="327" x2="225" y2="349"/>
    <line x1="241" y1="327" x2="257" y2="349"/>
  </g>
  <text x="241" y="372" text-anchor="middle" font-size="16" fill="#1f2937">国际留学生</text>

  <!-- 参与者泛化：国际留学生 → 学生 -->
  <line x1="241" y1="271" x2="241" y2="218" stroke="#556070" stroke-width="2" marker-end="url(#g34)"/>

  <!-- 关联实线 -->
  <g stroke="#556070" stroke-width="2">
    <line x1="254" y1="90" x2="389" y2="94"/>
    <line x1="254" y1="298" x2="408" y2="293"/>
    <line x1="256" y1="300" x2="400" y2="135"/>
  </g>

  <!-- 标注：参与者（两条引线）、用例、系统边界 -->
  <text x="122" y="225" text-anchor="middle" font-size="15" fill="#1f2937">参与者</text>
  <path d="M128 210 Q176 132 214 93" fill="none" stroke="#556070" stroke-width="1.3"/>
  <path d="M128 232 Q176 300 202 326" fill="none" stroke="#556070" stroke-width="1.3"/>
  <circle cx="221" cy="91" r="3.5" fill="#556070"/>
  <circle cx="209" cy="328" r="3.5" fill="#556070"/>
  <text x="703" y="352" text-anchor="middle" font-size="15" fill="#1f2937">用例</text>
  <path d="M638 299 Q672 330 692 344" fill="none" stroke="#556070" stroke-width="1.3"/>
  <circle cx="632" cy="293" r="3.5" fill="#556070"/>
  <text x="762" y="412" text-anchor="middle" font-size="15" fill="#1f2937">系统边界</text>
  <path d="M628 384 Q700 402 744 407" fill="none" stroke="#556070" stroke-width="1.3"/>
  <circle cx="624" cy="380" r="3.5" fill="#556070"/>
</svg>
