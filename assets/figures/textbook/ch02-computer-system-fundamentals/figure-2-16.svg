<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="1150" viewBox="0 0 1010 1150" font-family="sans-serif">
  <title>图 2-16 软件生命周期过程、活动关系图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 55（物理页 64）插图。顶部为系统生命周期框；其下虚线层界标注"系统需求/软件级别"。主体四条泳道：开发进程泳道（软件需求进程→软件需求数据→软件设计进程→软件设计描述→软件编码进程→源代码〔原书印作"源代术码"〕→集成进程→目标代码，左侧依次有软件需求标准/软件开发计划、软件设计标准、软件编码标准、软件开发计划输入）；验证泳道（软件需求验证、软件设计验证、软件编码验证、集成进程验证，输入软件需求标准/软件设计标准/软件编码标准等，各经验证活动输出测试用例/测试结果）；分析泳道（需求覆盖率分析×2、结构覆盖率分析、测试结果分析，输出分析报告，另有源/目标代码追踪）；底部三个横向长条为软件配置管理进程、软件质量保证进程、审定联络进程，左侧软件计划进程纵列以软件验证计划、软件配置管理计划、软件质量保证计划、软件审定计划输入。原书个别退化字（源代术码、口目标代码）照录。</desc>
  <rect width="1010" height="1150" fill="#ffffff"/>
  <defs>
    <marker id="c16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#556070"/>
    </marker>
  </defs>
  <rect width="1010" height="1150" fill="#ffffff"/>

  <rect x="30" y="30" width="920" height="52" fill="#f2f6fc" stroke="#7d8da5" stroke-width="2"/>
  <text x="490" y="63" text-anchor="middle" font-size="18" fill="#1f2937">系统生命周期</text>
  <line x1="30" y1="112" x2="950" y2="112" stroke="#8a99ad" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="140" font-size="15" fill="#1f2937">系统需求</text>
  <text x="45" y="161" font-size="15" fill="#1f2937">软件级别</text>
  <line x1="350" y1="82" x2="350" y2="160" stroke="#556070" stroke-width="2" marker-end="url(#c16)"/>

  <!-- 泳道外框 -->
