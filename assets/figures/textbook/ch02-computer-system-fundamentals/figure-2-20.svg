    <rect x="135" y="20" width="120" height="46"/>
    <rect x="255" y="20" width="170" height="46"/>
    <rect x="425" y="20" width="180" height="46"/>
    <rect x="605" y="20" width="140" height="46"/>
  </g>
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="75" y="50">DMAC</text>
    <text x="195" y="50">SMAC</text>
    <text x="340" y="50">Length/Type</text>
    <text x="515" y="50">DATA/PAD</text>
