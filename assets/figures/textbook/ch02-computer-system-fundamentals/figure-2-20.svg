<svg xmlns="http://www.w3.org/2000/svg" width="760" height="90" viewBox="0 0 760 90" font-family="sans-serif">
  <title>图 2-20 以太帧结构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 64（物理页 73）插图。以太帧五个字段依次为 DMAC、SMAC、Length/Type、DATA/PAD、FCS。</desc>
  <rect width="760" height="90" fill="#ffffff"/>
  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="2">
