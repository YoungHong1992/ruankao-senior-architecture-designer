<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="sans-serif">
  <title>表 2-6 ISO/OSI模型与TCP/IP模型的对比</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 72-73（物理页 81-82）表格，跨页续印，含合并单元格。三列：ISO/OSI 模型、TCP/IP 协议、TCP/IP 模型。应用/表示/会话层（左合并）对应 FTP、Telnet、SMTP、NFS、SNMP 与应用层；传输层 TCP、UDP；网络层 IP、ICMP、ARP、RARP 对网际层；数据链路层与物理层行对应 Enternet IEEE 802.3〔原书如此〕、FDDI、Token-Ring/IEEE 802.3 硬件层、ARCnet、PPP/SLIP，右列网络接口层与硬件层。</desc>
  <rect width="960" height="480" fill="#ffffff"/>
  <rect x="30" y="30" width="900" height="420" fill="#f6f9fd" stroke="#556070" stroke-width="1.8"/>
  <g fill="#dce6f3" stroke="#556070" stroke-width="1.8">
    <rect x="30" y="30" width="150" height="55"/>
    <rect x="180" y="30" width="545" height="55"/>
    <rect x="725" y="30" width="205" height="55"/>
  </g>
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="105" y="64" font-weight="bold">ISO/OSI 模型</text>
    <text x="452" y="64" font-weight="bold">TCP/IP 协议</text>
    <text x="827" y="64" font-weight="bold">TCP/IP 模型</text>
  </g>
  <!-- 行分隔 -->
  <g stroke="#556070" stroke-width="1.3">
    <line x1="30" y1="180" x2="930" y2="180"/>
    <line x1="30" y1="255" x2="930" y2="255"/>
    <line x1="30" y1="315" x2="930" y2="315"/>
    <line x1="30" y1="380" x2="930" y2="380"/>
  </g>
  <!-- 竖线 -->
  <g stroke="#556070" stroke-width="1.5">
    <line x1="180" y1="85" x2="180" y2="450"/>
    <line x1="725" y1="85" x2="725" y2="450"/>
  </g>
  <g font-size="16" fill="#1f2937">
    <text x="105" y="135" text-anchor="middle">应用层</text>
    <text x="105" y="165" text-anchor="middle">表示层</text>
    <text x="105" y="195" text-anchor="middle">会话层</text>
    <text x="105" y="222" text-anchor="middle">传输层</text>
    <text x="105" y="290" text-anchor="middle">网络层</text>
    <text x="105" y="352" text-anchor="middle">数据链路层</text>
    <text x="105" y="420" text-anchor="middle">物理层</text>
  </g>
  <!-- 上部应用层协议格（五分格） -->
  <g stroke="#556070" stroke-width="1.3">
    <line x1="180" y1="180" x2="725" y2="180"/>
    <line x1="305" y1="85" x2="305" y2="180"/>
    <line x1="435" y1="85" x2="435" y2="180"/>
    <line x1="555" y1="85" x2="555" y2="180"/>
    <line x1="665" y1="85" x2="665" y2="180"/>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="242" y="125">文件传输</text>
    <text x="242" y="148">协议FTP</text>
    <text x="370" y="125">远程登录协</text>
    <text x="370" y="148">议 Telnet</text>
    <text x="495" y="125">电子邮</text>
    <text x="495" y="148">件协议</text>
    <text x="495" y="171">SMTP</text>
    <text x="610" y="125">网络文件服务协</text>
    <text x="610" y="148">议NFS</text>
    <text x="695" y="125">网络管理协</text>
    <text x="695" y="148">议SNMP</text>
    <text x="827" y="140">应用层</text>
  </g>
  <!-- 传输层 -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="335" y="222">TCP</text>
    <text x="560" y="222">UDP</text>
    <text x="827" y="222">传输层</text>
  </g>
  <line x1="450" y1="180" x2="450" y2="255" stroke="#556070" stroke-width="1.3"/>
  <!-- 网络层 -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="335" y="290">IP</text>
    <text x="575" y="290">ICMP</text>
    <text x="705" y="290">ARP</text>
    <text x="680" y="290"> </text>
    <text x="827" y="290">网际层</text>
  </g>
  <line x1="500" y1="255" x2="500" y2="315" stroke="#556070" stroke-width="1.3"/>
  <line x1="645" y1="255" x2="645" y2="315" stroke="#556070" stroke-width="1.3"/>
  <text x="715" y="290" font-size="15" fill="#1f2937">RARP</text>
  <!-- 数据链路层/物理层（合并跨行） -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="280" y="352">Enternet</text>
    <text x="280" y="375">IEEE 802.3</text>
    <text x="415" y="363">FDDI</text>
    <text x="560" y="352">Token-Ring/IEEE 802.3</text>
    <text x="560" y="375">硬件层</text>
    <text x="660" y="363">ARCnet</text>
    <text x="782" y="352">PPP/</text>
    <text x="782" y="375">SLIP</text>
    <text x="855" y="352">网络接口层</text>
    <text x="855" y="412">硬件层</text>
  </g>
  <g stroke="#556070" stroke-width="1.3">
    <line x1="352" y1="315" x2="352" y2="450"/>
    <line x1="478" y1="315" x2="478" y2="450"/>
    <line x1="735" y1="315" x2="735" y2="450"/>
    <line x1="800" y1="380" x2="930" y2="380"/>
    <line x1="800" y1="315" x2="800" y2="450"/>
  </g>
</svg>
