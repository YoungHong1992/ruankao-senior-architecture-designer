<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="sans-serif">
  <title>图 2-5 数据库的设计步骤</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 34（物理页 43）插图。纵向主流程：需求分析→概念结构设计→逻辑结构设计→物理结构设计，相邻步骤间分别标注需求说明书、用户的数据模式（即与DBMS无关的概念模型）、视图概念模式及应用处理说明书。输入：顶部左「当前和未来应用的数据要求」引入需求分析框顶左；顶部右「数据处理要求」横线左端下行引入需求分析框顶右，并经右侧竖线分别引入概念结构设计、逻辑结构设计、物理结构设计；左侧「转换规则、规范化理论」引入逻辑结构设计，「DBMS特性」引入物理结构设计并分叉上行引入逻辑结构设计左下，「硬件、OS特性」引入物理结构设计。</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="2">
    <rect x="330" y="95" width="260" height="46"/>
    <rect x="320" y="185" width="280" height="46"/>
    <rect x="320" y="355" width="255" height="46"/>
    <rect x="315" y="465" width="255" height="46"/>
  </g>
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="460" y="124">需求分析</text>
    <text x="460" y="214">概念结构设计</text>
    <text x="447" y="384">逻辑结构设计</text>
    <text x="442" y="494">物理结构设计</text>
  </g>

  <g stroke="#4a5568" stroke-width="2" fill="none">
    <!-- 顶部左输入：当前和未来应用的数据要求 → 需求分析框顶左 -->
    <path d="M268 42 H387 V91" marker-end="url(#a25)"/>
    <!-- 顶部右输入：数据处理要求 横线左端下行入需求分析框顶右，竖线三路左引 -->
    <path d="M790 55 H465 V91" marker-end="url(#a25)"/>
    <path d="M712 55 V487"/>
    <path d="M712 207 H604" marker-end="url(#a25)"/>
    <path d="M712 377 H579" marker-end="url(#a25)"/>
    <path d="M712 487 H574" marker-end="url(#a25)"/>
    <!-- 主流程 -->
    <line x1="460" y1="141" x2="460" y2="181" marker-end="url(#a25)"/>
    <line x1="460" y1="231" x2="460" y2="351" marker-end="url(#a25)"/>
    <line x1="460" y1="401" x2="460" y2="461" marker-end="url(#a25)"/>
    <!-- 左侧输入 -->
    <line x1="235" y1="377" x2="316" y2="377" marker-end="url(#a25)"/>
    <path d="M170 482 H195 M195 482 V388 H316" marker-end="url(#a25)" fill="none"/>
    <line x1="170" y1="482" x2="311" y2="482" marker-end="url(#a25)"/>
    <line x1="170" y1="502" x2="311" y2="502" marker-end="url(#a25)"/>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="472" y="168">需求说明书</text>
    <text x="472" y="268">用户的数据模式</text>
    <text x="472" y="292">(即与DBMS 无关</text>
    <text x="472" y="316">的概念模型)</text>
    <text x="472" y="430">视图、概念模式</text>
    <text x="472" y="454">及应用处理说明书</text>
    <text x="88" y="370">转换规则、规范化理论，</text>
    <text x="75" y="476">DBMS特性</text>
    <text x="75" y="522">硬件、OS特性</text>
  </g>
  <g font-size="16" fill="#1f2937" text-anchor="middle">
    <text x="172" y="36">当前和未来应用的</text>
    <text x="146" y="58">数据要求</text>
    <text x="712" y="38">数据处理要求</text>
  </g>
</svg>
