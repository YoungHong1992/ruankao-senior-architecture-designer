<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="sans-serif">
  <title>图 2-5 数据库的设计步骤</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 34（物理页 43）插图。纵向主流程：需求分析→概念结构设计→逻辑结构设计→物理结构设计，相邻步骤间分别标注需求说明书、用户的数据模式（即与DBMS无关的概念模型）、视图概念模式及应用处理说明书；右侧有一条自需求分析引下、分别指回三个设计步骤的迭代线；左侧输入：转换规则规范化理论→逻辑结构设计，DBMS特性与硬件OS特性→物理结构设计。原图连线端点被扫描弱化处按可见走向转录。</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="2">
    <rect x="390" y="20" width="220" height="42"/>
    <rect x="370" y="120" width="260" height="44"/>
    <rect x="370" y="260" width="260" height="44"/>
    <rect x="370" y="420" width="260" height="44"/>
  </g>
  <g font-size="17" fill="#1f2937">
    <text x="500" y="47" text-anchor="middle">需求分析</text>
    <text x="500" y="148" text-anchor="middle">概念结构设计</text>
    <text x="500" y="288" text-anchor="middle">逻辑结构设计</text>
    <text x="500" y="448" text-anchor="middle">物理结构设计</text>
  </g>

  <g stroke="#4a5568" stroke-width="2" fill="none">
    <line x1="500" y1="62" x2="500" y2="116" marker-end="url(#a25)"/>
    <line x1="500" y1="164" x2="500" y2="256" marker-end="url(#a25)"/>
    <line x1="500" y1="304" x2="500" y2="416" marker-end="url(#a25)"/>
    <!-- 右侧迭代轨 -->
    <path d="M610 41 H765 V442 H634"/>
    <path d="M765 142 H634" marker-end="url(#a25)"/>
    <path d="M765 282 H634" marker-end="url(#a25)"/>
    <!-- 左侧输入 -->
    <line x1="250" y1="282" x2="366" y2="282" marker-end="url(#a25)"/>
    <line x1="185" y1="436" x2="366" y2="436" marker-end="url(#a25)"/>
    <line x1="185" y1="460" x2="366" y2="460" marker-end="url(#a25)"/>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="512" y="94">需求说明书</text>
    <text x="512" y="196">用户的数据模式</text>
    <text x="512" y="218">(即与DBMS 无关</text>
    <text x="512" y="240">的概念模型)</text>
    <text x="512" y="336">视图、概念模式</text>
    <text x="512" y="358">及应用处理说明书</text>
    <text x="88" y="272">转换规则、规范化理论，</text>
    <text x="88" y="426">DBMS特性</text>
    <text x="88" y="476">硬件、OS特性</text>
  </g>
</svg>
