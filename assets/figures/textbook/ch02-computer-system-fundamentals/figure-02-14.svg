<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" font-family="sans-serif">
  <title>图 2-14 嵌入式系统软件组成架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 50（物理页 59）插图。五层架构：应用层（工业控制应用、军事应用、物联网应用、…、移动设备应用）；中间件层（DDS/CORBA、Hadoop、数据库(DB)、OpenGL、JAVA、虚拟机）；操作系统层（可配置组件：文件系统/设备管理/运行时库与图形用户接口/网络管理/Agent管理；嵌入式(实时)操作系统(E(RT)OS)下辖任务管理、存储管理、通信管理、时间管理，左侧有双向大箭头）；抽象层（硬件抽象(HAL)、板级支持包(BSP)）；硬件层（A/D、D/A、I/O、微嵌入式处理器、通用接口、ROM、SDRAM、人机交互接口）。</desc>
  <rect width="920" height="840" fill="#ffffff"/>
  <g fill="#f2f6fc" stroke="#7d8da5" stroke-width="2">
    <rect x="40" y="20" width="840" height="90"/>
    <rect x="40" y="120" width="840" height="185"/>
    <rect x="40" y="315" width="840" height="255"/>
    <rect x="40" y="580" width="840" height="75"/>
    <rect x="40" y="665" width="840" height="160"/>
  </g>
