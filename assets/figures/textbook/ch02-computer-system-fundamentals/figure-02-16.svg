<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="990" viewBox="0 0 1010 990" font-family="sans-serif">
  <title>图 2-16 软件生命周期过程、活动关系图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 55（物理页 64）插图。顶部系统生命周期框，其下虚线层界标注「系纳需录/软件级别」（原书如此，当为系统需求）；三处列顶标注：系统需求（软件开发进程列）、系统需求（验证列，悬于容器上方无箭头）、软件需求数据（分析列）。左侧软件计划进程纵箱纵贯全图。软件开发进程容器内竖直顺序链：软件需求进程→(软件需求数据)→软件设计进程→(软件设计描述)→软件编码进程→(源代术码，原书如此)→集成进程→(目标代码)，容器底标注软件开发进程。验证容器内：软件需求标准/软件需求验证→(软件需求数据/软件设计标准)→软件设计验证→(软件设计描述/软件编码标准)→软件编码验证→(源代码)→集成进程验证→(口目标代码/测试用列/过程，原书如此)→测试，容器底标注验证活动，由软件验证计划驱动（箭头指向容器左缘）。分析容器内：需求覆盖率分析→(软件设计描述)→需求覆盖率分析→(测试用例/源代码目标代码)→结构覆盖率分析→(源代码/目标代码)→源/目标代码追踪→(测试用例/测试过程)→测试结果分析，容器底标注验证的验证；各分析框向右输出分析报告。开发列四项数据（软件需求数据、软件设计描述、源代码、目标代码）横向流入验证列，验证列输出测试用例×2 与测试结果。验证容器旁注走查分析报告/测试用例/过程；底部软件配置管理进程、软件质量保证进程、审定联络进程分别由软件配置管理计划、软件质量保证计划、软件审定计划驱动。原书个别退化字照录。</desc>
