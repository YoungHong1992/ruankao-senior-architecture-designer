<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="sans-serif">
  <title>图 2-19 总线结构和环形结构网络</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 64（物理页 73）插图。(a) 总线结构：一根水平总线，五个结点设备分接其上下（上2下3）；(b) 环形结构：六个结点设备沿封闭圆环均布。</desc>
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- (a) 总线结构 -->
  <g stroke="#9aa7b8" stroke-width="2.5">
    <line x1="90" y1="120" x2="330" y2="120"/>
    <line x1="135" y1="120" x2="135" y2="70"/>
    <line x1="235" y1="120" x2="235" y2="70"/>
    <line x1="135" y1="120" x2="135" y2="180"/>
    <line x1="235" y1="120" x2="235" y2="180"/>
    <line x1="335" y1="120" x2="335" y2="180"/>
  </g>
  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="2.5">
    <rect x="113" y="30" width="44" height="40"/>
    <rect x="213" y="30" width="44" height="40"/>
    <rect x="113" y="180" width="44" height="40"/>
    <rect x="213" y="180" width="44" height="40"/>
    <rect x="313" y="180" width="44" height="40"/>
  </g>
  <text x="210" y="275" text-anchor="middle" font-size="17" fill="#1f2937">(a) 总线结构</text>
  <!-- (b) 环形结构 -->
  <circle cx="580" cy="130" r="105" fill="none" stroke="#9aa7b8" stroke-width="2.5"/>
  <g fill="#eef3fb" stroke="#7d8da5" stroke-width="2.5">
    <rect x="558" y="3" width="44" height="36"/>
    <rect x="665" y="63" width="40" height="36"/>
    <rect x="655" y="185" width="40" height="36"/>
    <rect x="558" y="240" width="44" height="36"/>
    <rect x="450" y="185" width="40" height="36"/>
    <rect x="448" y="63" width="40" height="36"/>
  </g>
  <text x="580" y="320" text-anchor="middle" font-size="17" fill="#1f2937">(b) 环形结构</text>
</svg>
