<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="sans-serif">
  <title>图 2-15 软件生存周期与系统生存周期的关系</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 54（物理页 63）插图。中央竖直主线：系统需求→高层需求→（单向下箭头止于软件生存周期过程大框顶缘；另起一条竖线自大框底缘下行）→源程序代码→可执行目标代码，均为单向下箭头。高层需求四周：系统需求右缘引出一条单头弧（箭头指入系统需求右缘，另一端无箭头、并入高层需求右缘上部的箭头簇）；软件架构与高层需求之间一条双头弧（上行端箭头朝右上指入高层需求左缘上部，下行端箭头指入软件架构顶缘）；底层需求顶缘右段与高层需求之间一条双头弧（沿高层需求右缘外侧上行、越过其顶边：一端箭头向下落在高层需求顶边中段偏右、紧邻系统需求直下箭头，另一端箭头向下落在底层需求顶缘右段）；高层需求底缘中点引出单向下箭头止于大框顶缘；可执行目标代码右缘引出两条单头大回环、沿大框右壁外侧上行，箭头汇入高层需求右缘。其余：软件架构⇄源程序代码 双向一对弧；源程序代码两下角各引一条侧弧、与主线箭头一同向下汇入可执行目标代码顶部；源程序代码右缘引出一条弧线、穿过大框底壁上行、箭头指入底层需求下缘；可执行目标代码另引一条线穿过大框底壁右端、沿大框内走廊上行、箭头指入底层需求右缘；软件架构与底层需求之间无任何连线，两者同处一个大框（软件生存周期过程）。</desc>
  <rect width="920" height="620" fill="#ffffff"/>
