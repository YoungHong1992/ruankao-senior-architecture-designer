<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="sans-serif">
  <title>图 2-35 多媒体系统的基本组成</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 88（物理页 97）插图。树形：多媒体系统分为多媒体硬件（多媒体计算机（MPC、图形工作站等）、多媒体板卡(显示卡、音频卡、视频卡等)、多媒体外部设备(触摸屏、扫描仪、摄像头等)）与多媒体软件（多媒体系统软件[多媒体驱动程序、多媒体操作系统]、多媒体支持软件[多媒体素材制作工具、多媒体著作工具、多媒体编程语言]、多媒体应用软件）。</desc>
  <rect width="900" height="640" fill="#ffffff"/>
  <g stroke="#9aa7b8" stroke-width="2" fill="none">
    <!-- 根 → 两分支 -->
    <path d="M145 320 H185 V150 H225"/>
    <path d="M185 320 V480 H225"/>
    <!-- 硬件分支：脊线 + 三个叶 -->
    <line x1="318" y1="150" x2="332" y2="150"/>
    <line x1="332" y1="66" x2="332" y2="216"/>
    <line x1="332" y1="66" x2="347" y2="66"/>
    <line x1="332" y1="141" x2="347" y2="141"/>
    <line x1="332" y1="216" x2="347" y2="216"/>
    <!-- 软件分支：脊线 + 三个子节点 -->
    <line x1="318" y1="480" x2="332" y2="480"/>
    <line x1="332" y1="396" x2="332" y2="596"/>
    <line x1="332" y1="396" x2="347" y2="396"/>
    <line x1="332" y1="496" x2="347" y2="496"/>
    <line x1="332" y1="596" x2="347" y2="596"/>
    <!-- 系统软件子括线 -->
    <line x1="520" y1="402" x2="540" y2="402"/>
    <line x1="540" y1="371" x2="540" y2="441"/>
    <line x1="540" y1="371" x2="555" y2="371"/>
    <line x1="540" y1="441" x2="555" y2="441"/>
    <!-- 支持软件子括线 -->
    <line x1="520" y1="502" x2="540" y2="502"/>
    <line x1="540" y1="471" x2="540" y2="611"/>
    <line x1="540" y1="471" x2="555" y2="471"/>
    <line x1="540" y1="541" x2="555" y2="541"/>
    <line x1="540" y1="611" x2="555" y2="611"/>
  </g>
  <g font-size="16" fill="#1f2937">
    <text x="30" y="326">多媒体系统</text>
    <text x="228" y="156">多媒体硬件</text>
    <text x="228" y="486">多媒体软件</text>
    <text x="352" y="72">多媒体计算机（MPC、图形工作站等）</text>
    <text x="352" y="147">多媒体板卡(显示卡、音频卡、视频卡等)</text>
    <text x="352" y="222">多媒体外部设备(触摸屏、扫描仪、摄像头等)</text>
    <text x="352" y="402">多媒体系统软件</text>
    <text x="352" y="502">多媒体支持软件</text>
    <text x="352" y="602">多媒体应用软件</text>
    <text x="560" y="377">多媒体驱动程序</text>
    <text x="560" y="447">多媒体操作系统</text>
    <text x="560" y="477">多媒体素材制作工具</text>
    <text x="560" y="547">多媒体著作工具</text>
    <text x="560" y="617">多媒体编程语言</text>
  </g>
</svg>
