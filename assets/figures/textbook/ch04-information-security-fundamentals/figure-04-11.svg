<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="sans-serif">
  <title>图 4-11 风险评估各要素关系图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 172（物理页 181）插图。圆角矩形节点：脆弱性（左上）、资产（上中）、威胁（左中）、风险（中）、安全措施（右下）；椭圆节点：业务数据（顶中）、资产价值（右上）、安全需求（右中）、安全事件（左下）、残余风险（下中）。全部细实线，小实心三角箭头。17 条边：业务数据→资产（依赖，线被标签隔断）；脆弱性→资产（暴露）；资产→资产价值（拥有）；威胁→脆弱性（利用）；威胁→风险（增加，标签嵌线中）；风险→安全需求（导出，嵌线中）；威胁→安全事件（演变）；风险→残余风险（残留）；安全措施→残余风险（未控制，嵌线中）；残余风险→安全事件（可能诱发，嵌线中）；安全需求→资产价值（成本）；安全需求→安全措施（被满足）；脆弱性右下角→风险左上角（斜线，沿线无标注，印面如此）；脆弱性右下角→安全需求左上弧（缓斜线，两端均无箭头，方向无法判定，标「未被满足」）；资产价值左下弧→风险右上角（增加，与上一条缓斜线在中部 X 交叉）；安全措施左上角→威胁右下角（抗击）；安全措施左上角→风险右下角（降低）。</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <ellipse cx="400" cy="40" rx="60" ry="24" fill="#f4f7fc" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="400" y="45" text-anchor="middle" font-size="14" fill="#1f2937">业务数据</text>
  <rect x="340" y="96" width="120" height="36" rx="8" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="400" y="119" text-anchor="middle" font-size="14" fill="#1f2937">资产</text>
  <rect x="90" y="96" width="120" height="36" rx="8" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="150" y="119" text-anchor="middle" font-size="14" fill="#1f2937">脆弱性</text>
  <ellipse cx="720" cy="110" rx="64" ry="26" fill="#f4f7fc" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="720" y="115" text-anchor="middle" font-size="14" fill="#1f2937">资产价值</text>
  <rect x="60" y="276" width="120" height="36" rx="8" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="120" y="299" text-anchor="middle" font-size="14" fill="#1f2937">威胁</text>
  <rect x="340" y="276" width="120" height="36" rx="8" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="400" y="299" text-anchor="middle" font-size="14" fill="#1f2937">风险</text>
  <ellipse cx="720" cy="294" rx="64" ry="26" fill="#f4f7fc" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="720" y="299" text-anchor="middle" font-size="14" fill="#1f2937">安全需求</text>
  <ellipse cx="150" cy="480" rx="64" ry="26" fill="#f4f7fc" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="150" y="485" text-anchor="middle" font-size="14" fill="#1f2937">安全事件</text>
  <ellipse cx="400" cy="480" rx="64" ry="26" fill="#f4f7fc" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="400" y="485" text-anchor="middle" font-size="14" fill="#1f2937">残余风险</text>
  <rect x="560" y="456" width="120" height="36" rx="8" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="620" y="479" text-anchor="middle" font-size="14" fill="#1f2937">安全措施</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none">
    <line x1="400" y1="64" x2="400" y2="94" marker-end="url(#arr)"/>
    <line x1="210" y1="114" x2="338" y2="114" marker-end="url(#arr)"/>
    <line x1="460" y1="114" x2="652" y2="111" marker-end="url(#arr)"/>
    <line x1="130" y1="276" x2="148" y2="136" marker-end="url(#arr)"/>
    <line x1="180" y1="294" x2="338" y2="294" marker-end="url(#arr)"/>
    <line x1="460" y1="294" x2="654" y2="294" marker-end="url(#arr)"/>
    <line x1="122" y1="312" x2="146" y2="452" marker-end="url(#arr)"/>
    <line x1="400" y1="312" x2="400" y2="452" marker-end="url(#arr)"/>
    <line x1="560" y1="474" x2="466" y2="474" marker-end="url(#arr)"/>
    <line x1="334" y1="480" x2="216" y2="480" marker-end="url(#arr)"/>
    <line x1="720" y1="268" x2="720" y2="138" marker-end="url(#arr)"/>
    <line x1="706" y1="318" x2="636" y2="452" marker-end="url(#arr)"/>
    <line x1="210" y1="132" x2="344" y2="272" marker-end="url(#arr)"/>
    <line x1="212" y1="134" x2="662" y2="272"/>
    <line x1="676" y1="130" x2="458" y2="274" marker-end="url(#arr)"/>
    <line x1="560" y1="456" x2="182" y2="314" marker-end="url(#arr)"/>
    <line x1="560" y1="456" x2="458" y2="316" marker-end="url(#arr)"/>
  </g>

  <g font-size="12" fill="#374151">
    <text x="410" y="86">依赖</text>
    <text x="258" y="106">暴露</text>
    <text x="542" y="102">拥有</text>
    <text x="88" y="208">利用</text>
    <rect x="244" y="282" width="34" height="18" fill="#ffffff"/>
    <text x="250" y="296">增加</text>
    <rect x="540" y="282" width="34" height="18" fill="#ffffff"/>
    <text x="546" y="296">导出</text>
    <text x="78" y="388">演变</text>
    <text x="410" y="388">残留</text>
    <rect x="486" y="462" width="52" height="18" fill="#ffffff"/>
    <text x="490" y="476">未控制</text>
    <rect x="238" y="468" width="64" height="18" fill="#ffffff"/>
    <text x="242" y="482">可能诱发</text>
    <text x="730" y="208">成本</text>
    <text x="648" y="392">被满足</text>
    <text x="500" y="252">未被满足</text>
    <text x="524" y="192">增加</text>
    <text x="300" y="402">抗击</text>
    <text x="520" y="374">降低</text>
  </g>
</svg>
