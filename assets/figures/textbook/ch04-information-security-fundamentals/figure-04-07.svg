<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" font-family="sans-serif">
  <title>图 4-7 基于公钥的数字签名</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 159（物理页 168）插图。左右两个大外框，上标发送方、接收方。左框内为 A的私钥（D_A）与 B的公钥（E_B）；右框内为 B的私钥（D_B）与 A的公钥（E_A）。主链自左向右五段实线单向箭头，首段与末段下方标 P。三条竖箭头自下向上落到第 2、3、4 段横箭头上，底部标注分别为 D_A(P)、E_B(D_A(P))、D_A(P)，圆括号。</desc>
  <rect width="1080" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="250" y="36" text-anchor="middle" font-size="16" fill="#1f2937">发送方</text>
  <text x="760" y="36" text-anchor="middle" font-size="16" fill="#1f2937">接收方</text>
  <rect x="70" y="48" width="360" height="130" fill="none" stroke="#7d8da5" stroke-width="1.6"/>
  <rect x="560" y="48" width="360" height="130" fill="none" stroke="#7d8da5" stroke-width="1.6"/>

  <rect x="100" y="78" width="120" height="64" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="160" y="104" text-anchor="middle" font-size="15" fill="#1f2937">A的私钥</text>
  <text x="160" y="126" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-style="italic">D</tspan><tspan font-size="10" dy="3">A</tspan></text>
  <rect x="280" y="78" width="120" height="64" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="340" y="104" text-anchor="middle" font-size="15" fill="#1f2937">B的公钥</text>
  <text x="340" y="126" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-style="italic">E</tspan><tspan font-size="10" dy="3">B</tspan></text>
  <rect x="590" y="78" width="120" height="64" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="650" y="104" text-anchor="middle" font-size="15" fill="#1f2937">B的私钥</text>
  <text x="650" y="126" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-style="italic">D</tspan><tspan font-size="10" dy="3">B</tspan></text>
  <rect x="770" y="78" width="120" height="64" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.4"/>
  <text x="830" y="104" text-anchor="middle" font-size="15" fill="#1f2937">A的公钥</text>
  <text x="830" y="126" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-style="italic">E</tspan><tspan font-size="10" dy="3">A</tspan></text>

  <line x1="30" y1="110" x2="98" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="64" y="132" text-anchor="middle" font-size="14" fill="#1f2937">P</text>
  <line x1="220" y1="110" x2="278" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="110" x2="588" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="110" x2="768" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="890" y1="110" x2="980" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="940" y="132" text-anchor="middle" font-size="14" fill="#1f2937">P</text>

  <line x1="249" y1="230" x2="249" y2="112" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="249" y="252" text-anchor="middle" font-size="14" fill="#1f2937">
    <tspan font-style="italic">D</tspan><tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> (P) </tspan>
  </text>
  <line x1="494" y1="250" x2="494" y2="112" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="494" y="272" text-anchor="middle" font-size="14" fill="#1f2937">
    <tspan font-style="italic">E</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> (</tspan><tspan font-style="italic">D</tspan><tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> (P)) </tspan>
  </text>
  <line x1="739" y1="230" x2="739" y2="112" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="739" y="252" text-anchor="middle" font-size="14" fill="#1f2937">
    <tspan font-style="italic">D</tspan><tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> (P) </tspan>
  </text>
</svg>
