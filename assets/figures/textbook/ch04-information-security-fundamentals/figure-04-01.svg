<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" font-family="sans-serif">
  <title>图 4-1 保密通信模型</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 150（物理页 159）插图。左端明文P进入发送端加密算法E，密钥K自下方进入；密文C=E(K,P)传向接收端解密算法D，密钥K自下方进入，右端输出明文P。传输段有向上短箭头指向偷听者。右框至右端明文P的箭头头部在原图无法判定，本图不画该处箭头。</desc>
  <rect width="920" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="70" y="118" text-anchor="middle" font-size="16" fill="#1f2937">明文P</text>
  <text x="850" y="118" text-anchor="middle" font-size="16" fill="#1f2937">明文P</text>

  <rect x="150" y="88" width="150" height="58" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.6"/>
  <text x="225" y="78" text-anchor="middle" font-size="15" fill="#1f2937">发送端</text>
  <text x="225" y="122" text-anchor="middle" font-size="16" fill="#1f2937">加密算法E</text>

  <rect x="620" y="88" width="150" height="58" fill="#eef3fb" stroke="#7d8da5" stroke-width="1.6"/>
  <text x="695" y="78" text-anchor="middle" font-size="15" fill="#1f2937">接收端</text>
  <text x="695" y="122" text-anchor="middle" font-size="16" fill="#1f2937">解密算法D</text>

  <line x1="102" y1="112" x2="148" y2="112" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="112" x2="618" y2="112" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="112" x2="818" y2="112" stroke="#4a5568" stroke-width="1.6"/>

  <line x1="225" y1="168" x2="225" y2="146" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="225" y="188" text-anchor="middle" font-size="15" fill="#1f2937">密钥K</text>
  <line x1="695" y1="168" x2="695" y2="146" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="695" y="188" text-anchor="middle" font-size="15" fill="#1f2937">密钥K</text>

  <line x1="460" y1="112" x2="460" y2="58" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="460" y="46" text-anchor="middle" font-size="15" fill="#1f2937">偷听者</text>
  <text x="460" y="136" text-anchor="middle" font-size="15" fill="#1f2937">密文C=E(K,P)</text>
</svg>
