<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="sans-serif">
  <title>表 4-1 防御SYN Flooding攻击所需修改键值</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 167（物理页 176）表格。两列：值名称、值(REG_DWORD)（括号半角、REG 与 DWORD 间下划线）。表头加数据共 10 行；上下粗横线、行间细横线、列间一条竖线、左右无外框。第 5 行键名「Tcp Max ConnectResponseRetransmissions」中 Tcp 与 Max 之间有一个空格，其余键名内无空格；第 3、4 行值印面为「5 0 0」「4 0 0」（数字间有空格，照录；同表 300000 六位紧排可证非字距）；300000(5分钟) 括号半角。单元格逐格经扫描件核对。</desc>
  <rect width="700" height="400" fill="#ffffff"/>
  <line x1="40" y1="30" x2="660" y2="30" stroke="#556070" stroke-width="2.5"/>
  <line x1="40" y1="64" x2="660" y2="64" stroke="#556070" stroke-width="1"/>
  <line x1="40" y1="370" x2="660" y2="370" stroke="#556070" stroke-width="2.5"/>
  <line x1="470" y1="30" x2="470" y2="370" stroke="#556070" stroke-width="1"/>
  <g stroke="#556070" stroke-width="0.8">
    <line x1="40" y1="98" x2="660" y2="98"/>
    <line x1="40" y1="132" x2="660" y2="132"/>
    <line x1="40" y1="166" x2="660" y2="166"/>
    <line x1="40" y1="200" x2="660" y2="200"/>
    <line x1="40" y1="234" x2="660" y2="234"/>
    <line x1="40" y1="268" x2="660" y2="268"/>
    <line x1="40" y1="302" x2="660" y2="302"/>
    <line x1="40" y1="336" x2="660" y2="336"/>
  </g>
  <rect x="40" y="30" width="620" height="34" fill="#e8eef7"/>
  <g font-size="15" fill="#1f2937">
    <text x="60" y="53" font-weight="bold">值名称</text>
    <text x="490" y="53" font-weight="bold">值(REG_DWORD)</text>
    <text x="60" y="87">SynAttackProtect</text><text x="490" y="87">2</text>
    <text x="60" y="121">TcpMaxPortsExhausted</text><text x="490" y="121">1</text>
    <text x="60" y="155">TcpMaxHalfOpen</text><text x="490" y="155">5 0 0</text>
    <text x="60" y="189">TcpMaxHalfOpenRetried</text><text x="490" y="189">4 0 0</text>
    <text x="60" y="223">Tcp Max ConnectResponseRetransmissions</text><text x="490" y="223">2</text>
    <text x="60" y="257">TcpMaxDataRetransmissions</text><text x="490" y="257">2</text>
    <text x="60" y="291">EnablePMTUDiscovery</text><text x="490" y="291">0</text>
    <text x="60" y="325">KeepAliveTime</text><text x="490" y="325">300000(5分钟)</text>
    <text x="60" y="359">NoNameReleaseOnDemand</text><text x="490" y="359">1</text>
  </g>
</svg>
