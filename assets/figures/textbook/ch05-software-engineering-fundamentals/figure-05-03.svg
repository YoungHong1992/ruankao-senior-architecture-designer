<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">图5-3 螺旋模型</title>
  <desc id="desc">A spiral-model diagram with three expanding risk-analysis loops, prototype labels, planning and development regions, a cost axis, iteration arrow, and phase labels. The small superscript 4 after 成本 is legible in the source and is reproduced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="1120" fill="#fff"/>
  <g fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
