    <path d="M 720 720 C 650 695 635 640 660 585 C 690 525 790 500 900 510 C 1005 520 1080 590 1065 690 C 1050 780 965 815 875 805 C 790 795 735 765 720 720"/>
    <!-- Spiral process and phase guides visible across the loops -->
    <path d="M 535 280 C 590 220 665 190 745 177" marker-end="url(#arrow)"/>
    <path d="M 595 760 L 1305 245" stroke-dasharray="8 9"/>
    <path d="M 645 720 H 1370" stroke-dasharray="8 9"/>
    <path d="M 920 835 H 1220" stroke-dasharray="8 9"/>
    <path d="M 930 835 V 970" stroke-dasharray="8 9"/>
    <path d="M 1085 800 V 900" stroke-dasharray="8 9"/>
    <path d="M 600 150 V 1010"/>
    <path d="M 600 850 V 1030" stroke-dasharray="7 8"/>
    <path d="M 770 850 V 980" stroke-dasharray="7 8"/>
    <path d="M 940 840 V 950" stroke-dasharray="7 8"/>
    <path d="M 1175 840 V 900" stroke-dasharray="7 8"/>
    <!-- Small internal curves and review arcs -->
    <path d="M 460 790 C 485 850 545 875 625 877"/>
    <path d="M 510 720 C 545 665 600 635 675 628"/>
    <path d="M 760 640 C 820 615 880 620 930 645"/>
  </g>
