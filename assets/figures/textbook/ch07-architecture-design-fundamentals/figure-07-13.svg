<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" role="img" aria-labelledby="fig07-13-title fig07-13-desc">
  <title id="fig07-13-title">图7-13 仓库体系结构风格</title>
  <desc id="fig07-13-desc">复原自 sources/01-系统架构设计师教材 入库扫描件物理页 271（印刷页 262），图题：图7-13　仓库体系结构风格。结构要点：中央圆角矩形内标「仓　库」（二字间空档，照录）；周围 8 个空椭圆（原书椭圆内无字，照录），布于上左、上中、上右、左中、右中、下左、下中、下右。每个椭圆与中央框之间各一条双向细箭头（两端均有实心小箭头）：上、下三列为斜向，左右两列为水平。无其他元素。</desc>
  <defs>
    <marker id="fig07-13-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 Z" fill="#000000"/></marker>
  </defs>
  <rect width="850" height="440" fill="#ffffff"/>
  <g font-family="SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', serif" fill="#000000">
    <!-- 8 个空椭圆 -->
    <g stroke="#000000" stroke-width="1.2" fill="none">
      <ellipse cx="195" cy="88" rx="50" ry="25"/>
      <ellipse cx="425" cy="64" rx="50" ry="25"/>
      <ellipse cx="655" cy="88" rx="50" ry="25"/>
      <ellipse cx="130" cy="220" rx="50" ry="25"/>
      <ellipse cx="720" cy="220" rx="50" ry="25"/>
      <ellipse cx="195" cy="352" rx="50" ry="25"/>
      <ellipse cx="425" cy="376" rx="50" ry="25"/>
      <ellipse cx="655" cy="352" rx="50" ry="25"/>
    </g>
    <!-- 中央圆角框 -->
    <rect x="330" y="190" width="190" height="60" rx="14" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="425" y="227" text-anchor="middle" font-size="21">仓　库</text>
    <!-- 8 条双向细箭头 -->
    <g stroke="#000000" stroke-width="1.2">
      <line x1="232" y1="110" x2="338" y2="191" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="425" y1="91" x2="425" y2="188" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="618" y1="110" x2="512" y2="191" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="182" y1="220" x2="328" y2="220" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="522" y1="220" x2="668" y2="220" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="232" y1="330" x2="338" y2="249" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="425" y1="349" x2="425" y2="252" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
      <line x1="618" y1="330" x2="512" y2="249" marker-start="url(#fig07-13-ah)" marker-end="url(#fig07-13-ah)"/>
    </g>
  </g>
</svg>
