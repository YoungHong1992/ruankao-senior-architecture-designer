<svg xmlns="http://www.w3.org/2000/svg" width="760" height="521" viewBox="0 0 795 545">
  <title>图7-19 DSSA 的三层次系统模型（复原）</title>
  <desc>复原自 sources/01-系统架构设计师教材 入库扫描件物理页 279（印刷页 270），图题：图7-19 DSSA 的三层次系统模型。结构要点：三个水平长椭圆纵向排列、水平居中——上「领域开发环境」、中「领域特定的应用开发环境」、下「应用执行环境」；左列三个角色标签「领域构架师」「应用工程师」「操作员」各引一条水平右向单箭头，箭头终点为对应椭圆左顶点；上椭圆与中椭圆之间 5 条竖直向下单箭头，每条箭头线左侧紧贴竖排文字标签，自左向右为「参考结构」「参考需求」「构架」「领域模型」「开发工具」；中椭圆与下椭圆之间 1 条竖直向下单箭头，箭头线右侧两行标签「实例化的体／系结构」。无虚框、无双向箭头、无其他元素，原图没有的元素一律未画。注：左上角色标签第 3–4 字原书叠印，按图内「构架」标签字形判读为「构架」。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7.2" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9.5,4 L0.5,7.5 Z" fill="#8c8c8c"/>
    </marker>
  </defs>
  <rect width="795" height="545" fill="#ffffff"/>
  <style>
    .txt { fill:#1a1a1a; font-family:'WenQuanYi Zen Hei','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
    .ell { fill:none; stroke:#a6a6a6; stroke-width:1.6; }
    .line { stroke:#8c8c8c; stroke-width:1.4; fill:none; }
    .vlab { font-size:27px; }
  </style>

  <!-- 三个水平长椭圆：上、中、下 -->
  <ellipse class="ell" cx="517" cy="58" rx="266" ry="41"/>
  <ellipse class="ell" cx="515" cy="295" rx="266" ry="42"/>
  <ellipse class="ell" cx="516" cy="482" rx="262" ry="35"/>

  <!-- 椭圆内文字 -->
  <text class="txt" x="517" y="69" font-size="30" text-anchor="middle">领域开发环境</text>
  <text class="txt" x="515" y="306" font-size="29" text-anchor="middle">领域特定的应用开发环境</text>
  <text class="txt" x="516" y="493" font-size="30" text-anchor="middle">应用执行环境</text>

  <!-- 左列角色标签与水平右向单箭头（终点为椭圆左顶点） -->
  <text class="txt" x="160" y="68" font-size="28" text-anchor="end">领域构架师</text>
  <line class="line" x1="182" y1="58" x2="249" y2="58" marker-end="url(#ah)"/>
  <text class="txt" x="160" y="305" font-size="28" text-anchor="end">应用工程师</text>
  <line class="line" x1="182" y1="295" x2="246" y2="295" marker-end="url(#ah)"/>
  <text class="txt" x="160" y="493" font-size="28" text-anchor="end">操作员</text>
  <line class="line" x1="182" y1="482" x2="251" y2="482" marker-end="url(#ah)"/>

  <!-- 上椭圆到中椭圆：5 条竖直向下单箭头，标签竖排紧贴箭头线左侧 -->
  <line class="line" x1="358" y1="93" x2="358" y2="261" marker-end="url(#ah)"/>
  <text class="txt vlab" x="327" y="138" text-anchor="middle">参<tspan x="327" dy="30">考</tspan><tspan x="327" dy="30">结</tspan><tspan x="327" dy="30">构</tspan></text>
  <line class="line" x1="444" y1="99" x2="444" y2="255" marker-end="url(#ah)"/>
  <text class="txt vlab" x="413" y="138" text-anchor="middle">参<tspan x="413" dy="30">考</tspan><tspan x="413" dy="30">需</tspan><tspan x="413" dy="30">求</tspan></text>
  <line class="line" x1="518" y1="101" x2="518" y2="253" marker-end="url(#ah)"/>
  <text class="txt vlab" x="491" y="170" text-anchor="middle">构<tspan x="491" dy="30">架</tspan></text>
  <line class="line" x1="596" y1="99" x2="596" y2="255" marker-end="url(#ah)"/>
  <text class="txt vlab" x="569" y="138" text-anchor="middle">领<tspan x="569" dy="30">域</tspan><tspan x="569" dy="30">模</tspan><tspan x="569" dy="30">型</tspan></text>
  <line class="line" x1="679" y1="93" x2="679" y2="262" marker-end="url(#ah)"/>
  <text class="txt vlab" x="655" y="138" text-anchor="middle">开<tspan x="655" dy="30">发</tspan><tspan x="655" dy="30">工</tspan><tspan x="655" dy="30">具</tspan></text>

  <!-- 中椭圆到下椭圆：1 条竖直向下单箭头，右侧两行标签 -->
  <line class="line" x1="516" y1="339" x2="516" y2="446" marker-end="url(#ah)"/>
  <text class="txt vlab" x="534" y="380">实例化的体</text>
  <text class="txt vlab" x="562" y="414">系结构</text>
</svg>
