<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" role="img" aria-labelledby="fig07-12-title fig07-12-desc">
  <title id="fig07-12-title">图7-12 三层 C/S 体系结构风格</title>
  <desc id="fig07-12-desc">复原自 sources/01-系统架构设计师教材 入库扫描件物理页 271（印刷页 262），图题：图7-12　三层 C/S 体系结构风格（C/S 两侧有空格）。结构要点：顶部数据库圆柱内标「数据库」；其下垂直素线下接水平母线，母线两端下行分别接两台服务器塔（机箱简笔画，塔身绘左右分栏与格栅细节），塔下标签「应用服务器1」「应用服务器2」（阿拉伯数字 1、2）；每台服务器下另有小母线分接 3 台工作站简笔画，各标「工作站」共 6 处。全部连线为无箭头素线。</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <g font-family="SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', serif" fill="#000000">
    <!-- 数据库圆柱 -->
    <g stroke="#000000" stroke-width="1.3" fill="none">
      <path d="M 372 62 L 372 128 A 68 16 0 0 0 508 128 L 508 62"/>
      <ellipse cx="440" cy="62" rx="68" ry="16"/>
    </g>
    <text x="440" y="108" text-anchor="middle" font-size="20">数据库</text>
    <!-- 主母线与两路下行素线 -->
    <g stroke="#000000" stroke-width="1.2">
      <line x1="440" y1="144" x2="440" y2="172"/>
      <line x1="240" y1="172" x2="640" y2="172"/>
      <line x1="240" y1="172" x2="240" y2="205"/>
      <line x1="640" y1="172" x2="640" y2="205"/>
    </g>
    <!-- 服务器塔 1 -->
    <g stroke="#000000" stroke-width="1.2" fill="none">
      <rect x="202" y="205" width="76" height="147"/>
      <line x1="216" y1="205" x2="216" y2="352"/>
      <rect x="206" y="214" width="7" height="7"/>
      <rect x="206" y="230" width="7" height="7"/>
      <rect x="206" y="246" width="7" height="7"/>
      <rect x="206" y="262" width="7" height="7"/>
      <line x1="216" y1="233" x2="278" y2="233"/>
      <line x1="216" y1="261" x2="278" y2="261"/>
      <line x1="216" y1="289" x2="278" y2="289"/>
      <line x1="216" y1="317" x2="278" y2="317"/>
      <line x1="247" y1="205" x2="247" y2="352"/>
    </g>
    <text x="240" y="378" text-anchor="middle" font-size="19">应用服务器1</text>
    <!-- 服务器塔 2 -->
    <g stroke="#000000" stroke-width="1.2" fill="none">
      <rect x="602" y="205" width="76" height="147"/>
      <line x1="616" y1="205" x2="616" y2="352"/>
      <rect x="606" y="214" width="7" height="7"/>
      <rect x="606" y="230" width="7" height="7"/>
      <rect x="606" y="246" width="7" height="7"/>
      <rect x="606" y="262" width="7" height="7"/>
      <line x1="616" y1="233" x2="678" y2="233"/>
      <line x1="616" y1="261" x2="678" y2="261"/>
      <line x1="616" y1="289" x2="678" y2="289"/>
      <line x1="616" y1="317" x2="678" y2="317"/>
      <line x1="647" y1="205" x2="647" y2="352"/>
    </g>
    <text x="640" y="378" text-anchor="middle" font-size="19">应用服务器2</text>
    <!-- 小母线 1 与三台工作站 -->
    <g stroke="#000000" stroke-width="1.2">
      <line x1="240" y1="352" x2="240" y2="402"/>
      <line x1="95" y1="402" x2="385" y2="402"/>
      <line x1="95" y1="402" x2="95" y2="428"/>
      <line x1="240" y1="402" x2="240" y2="428"/>
      <line x1="385" y1="402" x2="385" y2="428"/>
    </g>
    <g stroke="#000000" stroke-width="1.2" fill="none">
      <rect x="51" y="428" width="88" height="50"/><rect x="61" y="435" width="68" height="29"/><rect x="45" y="481" width="100" height="21"/>
      <rect x="196" y="428" width="88" height="50"/><rect x="206" y="435" width="68" height="29"/><rect x="190" y="481" width="100" height="21"/>
      <rect x="341" y="428" width="88" height="50"/><rect x="351" y="435" width="68" height="29"/><rect x="335" y="481" width="100" height="21"/>
    </g>
    <text x="95" y="526" text-anchor="middle" font-size="18">工作站</text>
    <text x="240" y="526" text-anchor="middle" font-size="18">工作站</text>
    <text x="385" y="526" text-anchor="middle" font-size="18">工作站</text>
    <!-- 小母线 2 与三台工作站 -->
    <g stroke="#000000" stroke-width="1.2">
      <line x1="640" y1="352" x2="640" y2="402"/>
      <line x1="495" y1="402" x2="785" y2="402"/>
      <line x1="495" y1="402" x2="495" y2="428"/>
      <line x1="640" y1="402" x2="640" y2="428"/>
      <line x1="785" y1="402" x2="785" y2="428"/>
    </g>
    <g stroke="#000000" stroke-width="1.2" fill="none">
      <rect x="451" y="428" width="88" height="50"/><rect x="461" y="435" width="68" height="29"/><rect x="445" y="481" width="100" height="21"/>
      <rect x="596" y="428" width="88" height="50"/><rect x="606" y="435" width="68" height="29"/><rect x="590" y="481" width="100" height="21"/>
      <rect x="741" y="428" width="88" height="50"/><rect x="751" y="435" width="68" height="29"/><rect x="735" y="481" width="100" height="21"/>
    </g>
    <text x="495" y="526" text-anchor="middle" font-size="18">工作站</text>
    <text x="640" y="526" text-anchor="middle" font-size="18">工作站</text>
    <text x="785" y="526" text-anchor="middle" font-size="18">工作站</text>
  </g>
</svg>
