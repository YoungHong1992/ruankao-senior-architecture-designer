<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="sans-serif">
  <title>图 1-6 云架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 12（物理页 21）插图。三个 ProcessingUnit 水平相连并各自与 Virtualized Middleware（Messaging Grid、Data Grid、Processing Grid、Deployment Manager）双向连接。图内标题原印 ProcessingUnit 与 Processing Unit 两种写法并存，照录；右侧省略号表示更多处理单元；处理单元内部示意性小构件未转录。</desc>
  <rect width="780" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a5568"/>
    </marker>
    <marker id="ah6s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="40" y="30" width="190" height="150" rx="10" fill="#eef3fb" stroke="#7d8da5" stroke-width="2"/>
  <text x="135" y="58" text-anchor="middle" font-size="17" fill="#1f2937">ProcessingUnit</text>
  <rect x="295" y="30" width="190" height="150" rx="10" fill="#eef3fb" stroke="#7d8da5" stroke-width="2"/>
  <text x="390" y="58" text-anchor="middle" font-size="17" fill="#1f2937">ProcessingUnit</text>
  <rect x="550" y="30" width="190" height="150" rx="10" fill="#eef3fb" stroke="#7d8da5" stroke-width="2"/>
  <text x="645" y="58" text-anchor="middle" font-size="17" fill="#1f2937">Processing Unit</text>
  <text x="762" y="115" text-anchor="end" font-size="22" fill="#1f2937">……</text>

  <line x1="230" y1="150" x2="295" y2="150" stroke="#4a5568" stroke-width="5"/>
  <line x1="485" y1="150" x2="550" y2="150" stroke="#4a5568" stroke-width="5"/>

  <line x1="135" y1="184" x2="135" y2="256" stroke="#4a5568" stroke-width="3.5" marker-end="url(#ah6)" marker-start="url(#ah6s)"/>
  <line x1="390" y1="184" x2="390" y2="256" stroke="#4a5568" stroke-width="3.5" marker-end="url(#ah6)" marker-start="url(#ah6s)"/>
  <line x1="645" y1="184" x2="645" y2="256" stroke="#4a5568" stroke-width="3.5" marker-end="url(#ah6)" marker-start="url(#ah6s)"/>

  <rect x="60" y="260" width="660" height="160" rx="10" fill="#f6f9fd" stroke="#7d8da5" stroke-width="2"/>
  <text x="390" y="292" text-anchor="middle" font-size="19" fill="#1f2937">Virtualized Middleware</text>
  <rect x="80" y="315" width="140" height="80" fill="#e3ebf6" stroke="#9db0c9" stroke-width="1"/>
  <text x="150" y="348" text-anchor="middle" font-size="16" fill="#1f2937">Messaging</text>
  <text x="150" y="372" text-anchor="middle" font-size="16" fill="#1f2937">Grid</text>
  <rect x="245" y="315" width="140" height="80" fill="#e3ebf6" stroke="#9db0c9" stroke-width="1"/>
  <text x="315" y="348" text-anchor="middle" font-size="16" fill="#1f2937">Data</text>
  <text x="315" y="372" text-anchor="middle" font-size="16" fill="#1f2937">Grid</text>
  <rect x="410" y="315" width="140" height="80" fill="#e3ebf6" stroke="#9db0c9" stroke-width="1"/>
  <text x="480" y="348" text-anchor="middle" font-size="16" fill="#1f2937">Processing</text>
  <text x="480" y="372" text-anchor="middle" font-size="16" fill="#1f2937">Grid</text>
  <rect x="575" y="315" width="140" height="80" fill="#e3ebf6" stroke="#9db0c9" stroke-width="1"/>
  <text x="645" y="348" text-anchor="middle" font-size="16" fill="#1f2937">Deployment</text>
  <text x="645" y="372" text-anchor="middle" font-size="16" fill="#1f2937">Manager</text>
</svg>
