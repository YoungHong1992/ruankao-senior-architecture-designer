<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img" aria-labelledby="t d" style="max-width:100%;height:auto;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title id="t">计算机技术与软件专业技术资格（水平）考试专业类别、资格名称和级别对应表</title>
  <desc id="d">结构化重绘，不是原书图片。5 个专业类别（计算机软件、计算机网络、计算机应用技术、信息系统、信息服务）为列，3 个级别层次（高级资格、中级资格、初级资格）为行，共 27 项资格名称。高级资格一行在原表中跨全部 5 个专业类别合并。原表表头以斜线分为“资格名称”“专业类别”“级别层次”三段，此处改为文字标注；列宽、斜线分区与绝对尺寸未复刻。</desc>
  <style>
    .b{fill:none;stroke:#4a4a4a;stroke-width:1.4}
    .hd{fill:#e8f4f8;stroke:#4a4a4a;stroke-width:1.4}
    .rh{fill:#f4f9fb;stroke:#4a4a4a;stroke-width:1.4}
    .ht{font-size:16px;font-weight:600;fill:#1a1a1a;text-anchor:middle}
    .rt{font-size:16px;font-weight:600;fill:#1a1a1a;text-anchor:middle}
    .ct{font-size:14px;fill:#222}
    .cap{font-size:18px;font-weight:600;fill:#1a1a1a;text-anchor:middle}
    .note{font-size:12px;fill:#666;text-anchor:middle;font-style:italic}
  </style>

