  <rect class="hd" x="170" y="66" width="182" height="56"/><text class="ht" x="261" y="100">计算机软件</text>
  <rect class="hd" x="352" y="66" width="152" height="56"/><text class="ht" x="428" y="100">计算机网络</text>
