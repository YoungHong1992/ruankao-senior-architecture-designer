[project]
name = "ruankao-senior-architecture-designer"
version = "0.1.0"
description = "系统架构设计师备考知识库的治理与校验工具链"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# 代码风格工具。刻意不做默认组：主门禁必须能在没有任何第三方包的环境里跑。
lint = ["ruff==0.16.4"]

[tool.uv]
# 本仓库是知识库而非可安装的 Python 包：不构建、不安装自身，
# uv 只负责按 requires-python 准备解释器与脚本工具链的依赖。
package = false
# 锁文件的兼容判据是 version（本仓库为 1），不是 revision：uv 仅在 version
# 不受支持时拒绝加载锁文件，revision 不参与该判断。因此这里不跟着 revision
# 抬高门槛，>=0.10 是实测能读本锁文件的下限，给贡献者留足余地。
# CI 的 astral-sh/setup-uv 也读取本字段决定安装哪个 uv。
required-version = ">=0.10"

[tool.ruff]
# 120 是 validate_knowledge_base.py 既有的人工换行宽度，沿用它。
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# E501（行超长）刻意不启用：脚本里大量中文字符串字面量无法被拆行，
# 启用只会产生无法修复的噪声。行宽由 ruff format 尽力保证。
# RUF001/002/003（"易混淆的 Unicode 字符"）对中文项目是纯误报：全角标点
# （，：（）"" 等）本来就是正文与注释的正常内容，共触发 305 次。
ignore = ["RUF001", "RUF002", "RUF003"]
